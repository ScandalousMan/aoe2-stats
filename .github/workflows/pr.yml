name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      specs: ${{ steps.filter.outputs.specs }}
      design: ${{ steps.filter.outputs.design }}
      migrations: ${{ steps.filter.outputs.migrations }}
      config: ${{ steps.filter.outputs.config }}
      asset-packs: ${{ steps.filter.outputs.asset-packs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'apps/api/**'
              - 'apps/ingester/**'
              - 'apps/parser/**'
              - 'packages/core/**'
              - 'packages/providers/**'
              - 'packages/replay-engine/**'
              - 'packages/storage/**'
              - 'api/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
            web:
              - 'apps/web/**'
              - 'packages/design-system/**'
              # 004 T403: without this, a pack-only change (an icon added, removed or re-encoded)
              # runs neither `pnpm test` — so T408's resolver tests never execute — nor the
              # `visual` job below, even though Storybook mounts this exact directory via
              # `staticDirs` (T401), which would make a pack change the definition of a visual
              # change invisible to constitution VII's mandatory gate.
              - 'packages/game-assets/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              # T510: `scripts/**` above maps only to the `python` filter, so a pull request
              # touching only a Node check or the visual runner used to run the Python job and
              # neither `web` nor `visual` — and this feature ships four such checks
              # (story-baselines.mjs, a11y-allowlist.mjs, and the runner and spec they gate)
              # whose own edits were verified by nothing. `visual` runs on the same `if` as
              # `web` (see that job below), so listing these here is what makes both trigger.
              - 'scripts/checks/*.mjs'
              - 'scripts/visual/**'
              - 'tests/visual/**'
            design:
              - 'packages/design-system/**'
            migrations:
              - 'infra/migrations/**'
            config:
              - 'apps/api/src/aoe2stats_api/settings.py'
              - '.env.example'
              - 'scripts/checks/config-preflight.mjs'
              - 'vercel.json'
            specs:
              - 'specs/**'
              - '.env.example'
              - 'scripts/checks/spec_lint.py'
            asset-packs:
              - 'packages/game-assets/**'
              - 'docs/asset-packs.md'
              # 004 T403, load-bearing: the Game Content Usage Rules disclaimer anchor
              # (constitution X) can be removed by a pull request that touches no asset at all,
              # and this job has to run on exactly that pull request.
              - 'README.md'
              - 'scripts/checks/asset_packs.py'

  specs:
    name: Specs — cross-artifact lint
    needs: changes
    if: needs.changes.outputs.specs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Identifier coverage, task references, path agreement, alert vocabulary, configuration keys
      # and duplicated literals. What this catches, /speckit-analyze no longer looks for by hand:
      # a hand pass over prose samples and finds a different subset every time, which is what made
      # that phase look non-convergent.
      - name: Lint every feature that has reached tasks.md
        run: |
          status=0
          for feature in specs/*/; do
            [ -f "$feature/tasks.md" ] || continue
            uv run scripts/checks/spec_lint.py --feature "$feature" || status=1
          done
          exit $status

  asset-packs:
    name: Asset packs — the licence gate (constitution X, FR-011, SC-003)
    needs: changes
    if: needs.changes.outputs.asset-packs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Read-only, no network, stdlib only — every pack under packages/game-assets/ must carry a
      # complete LICENCE.md, a `READ ONLY` ruling must hold no payload file, the package must stay
      # under its size budget, docs/asset-packs.md must mirror every LICENCE.md, and README.md
      # must still carry the Game Content Usage Rules disclaimer. Removing either anchor — the
      # non-commercial condition or the disclaimer — lapses the permission constitution X grants,
      # which is why this job's own path filter (above) includes README.md and not only the packs.
      - run: uv run scripts/checks/asset_packs.py

  config:
    name: Configuration — settings.py and .env.example agree
    needs: changes
    if: needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # T391, `--contract` half. The other half — every declared key is actually set on the
      # deployment target — runs in `vercel.json`'s build command, because it is the only place
      # with a view of both the repository and the environment the code will run in; CI can see
      # one of the two. What runs here is the agreement between `settings.py` and `.env.example`
      # that the build-time half depends on being true: the preflight extracts its key list from
      # `settings.py` with a pattern, and a pattern that silently stops matching would keep
      # passing while covering fewer keys. This job is what makes that impossible to miss, on the
      # pull request that would introduce it rather than on the deploy that would suffer it.
      - run: node scripts/checks/config-preflight.mjs --contract

  python:
    name: Python — lint, types, tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # T015a: the same service the `migrations` job already runs Postgres 16 against, at the same
    # credentials `tests/db.py` falls back to — so `apps/api/tests` and `apps/ingester/tests`
    # (T015's throwaway-database harness, exercised from T021 on) actually run here instead of
    # skipping. It is reached over loopback (`localhost:5432`), which `PYTEST_DISABLE_NETWORK=1`
    # (constitution III, tests/conftest.py) explicitly still allows — only genuine outbound
    # network access is blocked, so the two compose without weakening the guard.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # T014d's own fault, made into a check (2026-09-04): `api/analyze.py`'s module-scope
      # `aoe2stats_analyzer` import 500'd on Vercel because it was a workspace member but never a
      # root `pyproject.toml` dependency — the thing the platform's Python runtime actually
      # installs from. This asserts every `aoe2stats_*` import any file under `api/` makes at
      # module scope is declared in the root manifest, on every pull request, rather than only on
      # the deploy that would suffer the gap.
      - run: uv run scripts/checks/api_entrypoint_deps.py
      # Unit tests must never touch the network: providers are exercised through fixtures.
      # Contract tests against real APIs live in nightly.yml. A reachable-but-empty database is
      # now guaranteed here, so tests/db.py hard-fails rather than skips if it cannot find one —
      # a skip exists only so a developer without Postgres running locally is not blocked.
      - run: uv run pytest -q
        env:
          PYTEST_DISABLE_NETWORK: "1"

  web:
    name: Web — types, lint, unit tests, built stylesheet, routing
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # T017a: `pnpm exec tsc --noEmit` from the root matches no package's scripts and no
      # root tsconfig.json — under TypeScript 7 it fails outright. `pnpm typecheck` runs each
      # workspace member's own `typecheck` script (`pnpm -r --if-present run typecheck`, the
      # same idiom `lint` and `test` already use below); `apps/web`'s runs `tsr generate` first
      # so TanStack's generated, uncommitted route tree exists before `tsc -b` checks it.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # T107: none of the three checks above ever builds apps/web, so none of them could have
      # caught the production defect this step exists for — Tailwind's automatic source detection
      # excludes the workspace-resolved preset import, and the bundle shipped tokens with almost
      # none of the utilities the components use. `built-css.mjs` asserts on the actual utilities,
      # not a byte-size floor: the token block alone already clears any plausible floor, which is
      # exactly why the broken bundle looked healthy.
      - run: pnpm --filter web build
      - run: node scripts/checks/built-css.mjs
      # T109: none of the checks above ever resolves a route through vercel.json's rewrites, so
      # none of them could have caught the production defect this step exists for — a reload, a
      # bookmark or a shared link to any client-side route other than `/` hit the platform's own
      # 404 before a line of JavaScript ran, because there was no fallback to `index.html`.
      - run: node scripts/checks/spa-routing.mjs
      # T509: fails on an allowlist entry missing a field or past its fix-by date — both decidable
      # from the file alone, which is why this lives here rather than in `visual`. The third
      # failure mode (a stale suppression the scan no longer reports) needs Playwright's results
      # and belongs to T507's scan in the `visual` job instead.
      - run: node scripts/checks/a11y-allowlist.mjs

  visual:
    name: Visual regression — affected stories and the built application
    needs: changes
    # T108: this used to gate on `design` alone, which only ever covers packages/design-system —
    # an apps/web-only change (a route, `__root.tsx`, anything under `src/features/`) never
    # triggered this job at all, story-based or otherwise. `web` is `design`'s superset (see the
    # `changes` job's filters above), so this now runs for both.
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, not the default depth-1 shallow clone every other job here uses: `pnpm
      # test:visual --changed` below (scripts/visual/run.mjs) diffs against `origin/main` (or
      # VISUAL_BASE_REF) to select stories, and a depth-1 checkout never has that ref locally at
      # all. That used to fail silently — `git diff` errored, the runner swallowed it as "nothing
      # changed", and this job passed having selected zero stories on every pull request (the
      # `runGitOrFail` in run.mjs now makes that failure fatal instead, so a regression here shows
      # up as a red job rather than a vacuous green one). Full history is the same trade-off the
      # `secrets` job below already makes for gitleaks, for the same reason: this job needs commits
      # a shallow clone doesn't carry, and per actions/checkout's own docs `fetch-depth: 0` is what
      # fetches "all history for all branches and tags" — including `origin/main` — regardless of
      # which event (`pull_request` or `push`) triggered the run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # T510: an `actions/cache` step for `packages/design-system/__screenshots__` used to sit
      # here, keyed only on `runner.os` and the base branch. Baselines are committed to the
      # repository (verified: `git ls-files` and the working tree agree on 1,796 files after
      # T504's rename), so `actions/checkout` above already puts the correct-for-this-commit set
      # in place — the cache step never restored anything checkout had not already provided. A
      # content-independent key made that redundancy actively harmful the moment T504 renamed
      # every baseline: a cache entry saved from a run before the rename would restore its 301
      # old-named files on top of (not instead of — `actions/cache` extracts additively, it does
      # not mirror) the 1,796 correctly-named ones checkout just supplied, and the very next step
      # (`story-baselines.mjs`, T503) does set equality between the Storybook index and the
      # baseline directory — it would then fail every run on 301 phantom "baseline with no
      # story" entries that have nothing to do with the pull request's actual diff. There is no
      # key formula that recovers value here: git is already the source of truth for this
      # directory, and a hash-of-contents key would only ever restore what checkout already
      # produced. Removed rather than repaired.
      - run: pnpm --filter design-system build-storybook
      # T503: set equality between the built Storybook index and the checked-in baselines, run
      # ahead of `--changed` below so a story merged with no baseline fails here — on every run,
      # not only the one that happens to select it — instead of surfacing only in nightly's
      # unscoped run, as one Playwright failure among many.
      - run: node scripts/checks/story-baselines.mjs
      # T108: `tests/visual/app-routes.spec.ts` serves this build (stubbing `/api/*` itself,
      # never `apps/api`) instead of screenshotting only the component library — the T107 defect
      # (every screen unstyled in production) never touched a Storybook story, so nothing above
      # this line could have caught it.
      - run: pnpm --filter web build
      # Scoped on purpose: CI is a court, not a factory. Full coverage runs nightly.
      - run: pnpm test:visual --changed
      # `--changed` only diff-scopes Storybook stories (scripts/visual/run.mjs) — app-routes.spec.ts
      # is not a story and always runs, screenshotting the routes a signed-in and a signed-out
      # visitor reach against the build the step above just produced.
      - run: pnpm exec playwright test tests/visual/app-routes.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            playwright-report/
            test-results/

  migrations:
    name: Migrations — up and down
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      # T008a: `alembic check` (a) compares `Base.metadata` in models.py against the database's
      # *current* revision and fails outright if that revision is not `head`, and (b) only then
      # autogenerates a diff to detect drift between the models and the migrations. It must run
      # here, against the database `upgrade head` just brought to `head` — run after `downgrade
      # -1` below it would report "Target database is not up to date" regardless of whether the
      # models and migrations agree, catching nothing. Verified locally: at `head` it exits 0
      # with "No new upgrade operations detected"; after `downgrade -1` it exits non-zero with
      # "Target database is not up to date" even though nothing in models.py had changed.
      - run: uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      - run: uv run alembic downgrade -1
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
