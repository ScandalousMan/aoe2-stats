name: Nightly watchtower

# The phase-1 stack has no always-on process, so this workflow is the monitor.
# It is deliberately allowed to fail loudly: a red nightly means something upstream moved.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contracts:
    name: Third-party API contracts
    runs-on: ubuntu-latest
    # T012b: this job is the only one that needs to see the publication-delay corpus, so its extra
    # `actions: write` scope — used below to list, download and re-upload the chained artifact that
    # *is* the corpus — stays out of every other job's plain `contents: read`. No production
    # credential is involved at any point: `GITHUB_TOKEN` is all the chain ever needs.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Restore the publication-delay corpus from the previous nightly run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/data-sources
          # Most recent non-expired upload named "publication-delay-corpus", across the whole
          # repository — artifacts are not scoped to a branch or a workflow file, so this finds
          # last night's upload regardless of which run produced it.
          artifact_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=publication-delay-corpus&per_page=100" \
            --jq '[.artifacts[] | select(.name == "publication-delay-corpus" and .expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$artifact_id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" > /tmp/publication-delay-corpus.zip
            unzip -o /tmp/publication-delay-corpus.zip -d docs/data-sources
            rm /tmp/publication-delay-corpus.zip
            echo "Restored corpus artifact ${artifact_id}: $(wc -l < docs/data-sources/publication_delay_samples.jsonl) sample(s) so far."
          else
            # The very first run ever, or every earlier artifact has already expired past its
            # retention window: a normal case, not a failure. contract_sources.py and
            # publication_delay.py both treat a missing corpus file as "zero samples so far"
            # (see publication_delay.read_samples) and start it from nothing.
            echo "No previous corpus artifact found; starting a fresh corpus."
          fi
          # Guarantee the file exists even on a first run, or if the probe step below fails before
          # recording anything: the re-upload step needs something to upload either way.
          touch docs/data-sources/publication_delay_samples.jsonl
      - name: Probe Steam, Relic, aoe.ms, aoe2companion and aoestats
        run: uv run --with requests scripts/checks/contract_sources.py
      - name: Re-upload the publication-delay corpus for the next nightly run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-delay-corpus
          path: docs/data-sources/publication_delay_samples.jsonl
          # This chain only ever needs to bridge one night — the workflow runs daily at 03:00 UTC,
          # and every run re-seeds the artifact from the one before it, so the "previous" artifact
          # the next run downloads is never more than ~24 h old. 90 days (GitHub's maximum) is pure
          # insurance against the nightly being paused or failing outright for a stretch, not a
          # claim that samples are discarded after that long: the corpus itself keeps growing
          # forever, because each night's upload carries everything the last one held.
          retention-days: 90
          if-no-files-found: error

  parser-canary:
    name: Parser canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Parse the reference replay with every known engine
        run: uv run --with aoe2rec-py --with mgz scripts/checks/parser_canary.py

  asset-packs:
    name: Asset packs — the licence gate (constitution X, FR-011, SC-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Unscoped, unlike `pr.yml`'s path-filtered job: a licence can lapse without a pull request
      # touching this repository at all — Microsoft's own rules changing underneath a recorded
      # `Checked` date is exactly the kind of drift this workflow exists to notice.
      - run: uv run scripts/checks/asset_packs.py

  # T061: each of the three jobs below connects to the production database with `DATABASE_URL`
  # (a repository secret, never a value checked in — constitution VIII/XII) and needs nothing else
  # installed beyond `uv sync`'s own resolution of the workspace, since `aoe2stats-storage` and
  # `aoe2stats-core` are already transitive dependencies of `aoe2stats-api`/`aoe2stats-ingester`
  # (the root `pyproject.toml`'s own `[project].dependencies`). Every job here is also in the
  # `report` job's own `needs:` list below — a job absent from it fails in silence, since `report`
  # is the only thing that turns a red job into a GitHub issue a human sees (this feature's
  # alerting is pull-based by design, per constitution I and `packages/core/src/aoe2stats_core/
  # alerting.py`'s own module docstring).
  cron-liveness:
    name: Cron liveness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Fail if the newest ingest_runs row started more than 30 hours ago (SC-007)
        run: uv run scripts/checks/cron_liveness.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  capture-audit:
    name: Capture audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: expired_total == 0, no capture past its own deadline, SC-002 lag under 48h
        run: uv run scripts/checks/capture_audit.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  alert-audit:
    name: Alert audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Fail on any unacknowledged severity-1 alert
        run: uv run scripts/checks/alert_audit.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # T393. The standing net under the same check `smoke.yml` runs on every push to `main`:
      # that one proves a deploy served, this one proves the deployment still serves a day
      # later — a configuration value edited by hand in the platform dashboard, a rotated
      # credential, an expired bucket token and a Neon compute that stopped answering all break
      # a deployment nobody has pushed to. `/` is static and answers 200 from the CDN through
      # every one of those, which is why an uptime check on the site itself never noticed.
      - name: /api/health and /api/me both answer 200
        run: node scripts/checks/production-health.mjs
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://aoe2-stats.com' }}

  free-tier-watch:
    name: Free-tier watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Warn at 70% of any free allowance (docs/adr/0002-hosting.md)
        run: uv run scripts/checks/free_tier_watch.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # T101: `pr.yml`'s `visual` job runs `pnpm test:visual --changed` — diff-scoped on purpose,
  # per its own comment ("CI is a court, not a factory"). This job is the factory side of that
  # split: `pnpm test:visual` with no flag (scripts/visual/run.mjs) walks every story in the
  # built Storybook rather than only the ones a diff touched, and — because that always spawns
  # Playwright against the whole of `tests/visual` (playwright.config.ts's `testDir`), unlike
  # `--changed`'s short-circuit when no story file changed — also runs `focus-ring.spec.ts`,
  # `privacy-notice-responsive.spec.ts` and, once `apps/web/dist` exists (the `pnpm --filter web
  # build` step below), `app-routes.spec.ts` (T108's built-application spec). `pr.yml` invokes
  # that last one explicitly a second time only to guarantee it on a PR whose diff never touched
  # a story file at all; here the unscoped run already reaches it, so no second invocation is
  # needed.
  visual-full:
    name: Visual regression — full suite, every story and the built application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter design-system build-storybook
      # T503: same set-equality check `pr.yml`'s `visual` job runs, same relative position —
      # ahead of the full run below, reading the whole built index rather than a diff-scoped
      # subset.
      - run: node scripts/checks/story-baselines.mjs
      # Needed for tests/visual/app-routes.spec.ts, part of the same testDir this job's
      # unscoped `pnpm test:visual` below walks in full — see the job comment above.
      - run: pnpm --filter web build
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs-nightly
          path: |
            playwright-report/
            test-results/

  report:
    name: Open an issue on failure
    runs-on: ubuntu-latest
    needs:
      [
        contracts,
        parser-canary,
        asset-packs,
        cron-liveness,
        capture-audit,
        alert-audit,
        production-smoke,
        free-tier-watch,
        visual-full,
      ]
    if: failure()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly watchtower failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              'The nightly watchtower failed. Something upstream moved.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check, in order:',
              '- a third-party API contract changed -> update `docs/data-sources.md` and the `aoe2-data-sources` skill',
              '- a game patch broke a parser -> see `docs/adr/0001-replay-parser.md`',
              '- the replay retention window moved -> the capture budget in `.env.example` may need revising',
              '- cron-liveness failed -> the Vercel cron has likely stopped firing; see `docs/adr/0002-hosting.md`',
              '- capture-audit failed -> a replay expired unarchived, is stuck past its capture deadline, or SC-002\'s archival lag has slipped; see `docs/risks.md`',
              '- alert-audit failed -> an unacknowledged severity-1 alert is sitting in `alerts`; investigate before acknowledging it',
              '- production-smoke failed -> the deployment is not serving; the job log names the cause, and `configuration_invalid` names the missing keys',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'watchtower',
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['watchtower'],
            });
