# Root of the uv workspace. This file has no source of its own — `[tool.uv] package = false`
# keeps it un-built — and exists to declare the workspace members, the shared dev toolchain, and
# the `ruff`/`mypy` configuration every member inherits. Per-package *requirements* (which version
# of `fastapi`, of `boto3`, ...) live in each member's own `pyproject.toml` (created starting
# T002); nothing here should duplicate a version constraint one of them already states.
#
# `dependencies` below is a different thing: T014d's fix, after the first real deployment proved
# it necessary. Vercel's Python runtime resolves the two platform entrypoints (`api/index.py`,
# `api/cron/ingest.py`) the same way `uv sync` does at the root of the tree (`docs/adr/
# 0002-hosting.md`) — and a bare `uv sync` only ever installs a workspace member that something
# reachable from the *root* project depends on, transitively. `package = false` stops uv from
# building `aoe2-stats` itself as a wheel; it does not stop the root `[project]` from declaring
# dependencies, and declaring them is exactly what turns "workspace member" into "installed by the
# platform's standard resolution path" for the two packages the deployed functions actually
# import: `aoe2stats-api` (`api/index.py`) and `aoe2stats-ingester` (`api/cron/ingest.py`'s
# module-scope `from aoe2stats_ingester.run import run_once`). Both are `workspace = true` sources
# below, not published versions, so this is still every dependency's version stated exactly once —
# apps/api/pyproject.toml and apps/ingester/pyproject.toml's own `dependencies` still carry their
# transitive requirements (fastapi, aoe2stats-storage, ...) and this list is not a second copy of
# them. `uv sync --all-packages --dev` (`.github/workflows/pr.yml`) is unaffected: `--all-packages`
# already installed every member regardless of whether anything depended on it.
[project]
name = "aoe2-stats"
version = "0.1.0"
description = "Workspace root for aoe2-stats. Not published."
requires-python = ">=3.13,<3.14"
dependencies = [
  "aoe2stats-api",
  "aoe2stats-ingester",
]

[tool.uv]
package = false

[tool.uv.sources]
aoe2stats-api = { workspace = true }
aoe2stats-ingester = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/providers",
  "packages/replay-engine",
  "packages/storage",
  "apps/api",
  "apps/ingester",
  "apps/analyzer",
]

# Shared dev toolchain, installed once for the whole workspace by `uv sync --all-packages --dev`
# (as `.github/workflows/pr.yml` does) rather than duplicated per member. `alembic` sits here and
# not in `packages/storage`: it is the tool that runs `infra/migrations/` against `DATABASE_URL`,
# never imported by application code, exactly like `ruff` and `mypy`. `types-requests` is a
# stub-only package (T061a): `requests` itself is never a runtime dependency of any workspace
# member — only `scripts/checks/contract_sources.py` imports it, via `uv run --with requests`, the
# nightly contract job's own way of installing it — but that script is now under `[tool.mypy]`'s
# `files`, and mypy needs the stub package to type-check a call to `requests` at all. `Pillow` is
# here for the same reason `alembic` is: a dev-time tool, never imported by any deployed
# application code, this time `scripts/ops/sync_map_thumbnails.py` (research.md D9, T448), which
# re-encodes local map images into `packages/game-assets/maps/` and needs it both to run and for
# its own test suite to collect.
[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "alembic>=1.13",
  "pytest-asyncio>=0.24",
  "types-requests>=2.32",
  "Pillow>=11.0",
]

# --- pytest --------------------------------------------------------------------------------------
# One session, one config, for the whole workspace: `.github/workflows/pr.yml` runs a single
# `uv run pytest -q` from the repository root with `PYTEST_DISABLE_NETWORK=1`. `testpaths` lists
# every workspace member's `tests/` directory plus `scripts/checks/tests`, `scripts/ops/tests` and
# `tests/architecture` — none of the three is a uv workspace member (all deliberately excluded from
# `[tool.uv.workspace]` above, predating this config for the first two), so without naming them
# here T048's liveness-check test, `acknowledge_alerts.py`'s own tests, and T018d's architecture
# guards would never be collected. `tests/architecture` holds only import-graph guards that span
# more than one workspace member (constitution III, V, XII) and so cannot live inside any single
# member's own `tests/`. Most of these directories do not exist yet; pytest does not error on a
# `testpaths` entry that is missing, it simply finds nothing there until the story that owns it
# lands.
[tool.pytest.ini_options]
testpaths = [
  "packages/core/tests",
  "packages/providers/tests",
  "packages/replay-engine/tests",
  "packages/storage/tests",
  "apps/api/tests",
  "apps/ingester/tests",
  "apps/analyzer/tests",
  "scripts/checks/tests",
  "scripts/ops/tests",
  "tests/architecture",
]
# `tests/conftest.py` (the network-blocking autouse fixture, constitution III) is not an ancestor
# directory of any path above, so pytest would never load it as a plain per-directory conftest.
# Registering it explicitly as a plugin makes it apply to every test in the workspace regardless of
# which member owns it. `pythonpath` puts the repository root on `sys.path` so `tests` resolves as
# an implicit namespace package (PEP 420) — no `tests/__init__.py` needed.
addopts = ["-p", "tests.conftest"]
pythonpath = ["."]
# `async def test_...` needs no `@pytest.mark.asyncio` anywhere in the workspace: this feature's
# backend is async throughout (async SQLAlchemy, the object store's worker-thread offload), so
# opting each test in individually would be pure ceremony.
asyncio_mode = "auto"

# --- ruff --------------------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps", "packages"]
# Ruff's default `include` also formats/lints fenced Python in every `*.md` file — the skills,
# docs and specs directories are documentation, not code, and are not ours to reformat.
# `scripts/checks/` is deliberately outside `[tool.uv.workspace]` (plan.md) — its tools are run
# through `uv run --with` rather than `uv run` from an installed package — but that is a packaging
# distinction, not a licence to skip the gate: `cron_liveness.py`, `capture_audit.py` and
# `alert_audit.py` import `aoe2stats_storage` directly, and `.github/workflows/pr.yml`'s `python`
# job's path filter now includes `scripts/**` and runs `ruff format --check` / `ruff check` over
# it same as every workspace member (T061a). `scripts/hooks/` is shell, not Python, and ruff never
# touched it either way; it stays out of this list because there is nothing here for it to exclude.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade — keep syntax current with the pinned Python
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = [
  "aoe2stats_core",
  "aoe2stats_providers",
  "aoe2stats_replay_engine",
  "aoe2stats_storage",
  "aoe2stats_api",
  "aoe2stats_ingester",
  "aoe2stats_analyzer",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- mypy (strict) ------------------------------------------------------------------------------
# Scoped to the seven workspace members' `src/` trees, plus the whole `scripts/checks/` and
# `scripts/ops/` directories (T061a, widened by T061c, then by the alert-acknowledgement tool):
# `files` names each directory rather than enumerating its scripts one by one, so a script added
# later (T100's `free_tier_watch.py`, and whatever follows it) is under this gate the moment it
# exists, with nothing to remember to update here. `exclude` then carves `scripts/checks/tests/`
# and `scripts/ops/tests/` back out, because test suites are excluded from this gate everywhere
# else in the tree (only ruff runs over them), and the same holds here — without it, naming the
# directory in `files` would pull its tests under strict mypy too. Every other member's own
# `tests/` is kept out the same way `apps/analyzer/tests` is (T302): `files` names only its `src/`
# tree, never the member's root, so there is nothing for `exclude` to carve back out there.
# `scripts/checks` is listed in `mypy_path` (not only `files`) for a different reason:
# `contract_sources.py` imports its sibling `publication_delay.py` as a bare top-level module
# (`from publication_delay import append_sample`, matching how `uv run scripts/checks/
# contract_sources.py` actually resolves it — the script's own directory on `sys.path`), and
# `explicit_package_bases` needs that directory declared as a root to resolve it the same way.
# `scripts/ops` needs no such entry: `acknowledge_alerts.py` imports only installed workspace
# packages, never a sibling script. `scripts/hooks/` is shell, not Python, and mypy has nothing to
# check there.
[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
warn_unused_configs = true
mypy_path = [
  "packages/core/src",
  "packages/providers/src",
  "packages/replay-engine/src",
  "packages/storage/src",
  "apps/api/src",
  "apps/ingester/src",
  "apps/analyzer/src",
  "scripts/checks",
]
files = [
  "packages/core/src",
  "packages/providers/src",
  "packages/replay-engine/src",
  "packages/storage/src",
  "apps/api/src",
  "apps/ingester/src",
  "apps/analyzer/src",
  "scripts/checks",
  "scripts/ops",
]
exclude = [
  "^scripts/checks/tests/",
  "^scripts/ops/tests/",
]

[[tool.mypy.overrides]]
# Third-party packages without inline types or published stubs. Extend this list rather than
# disabling strict globally when a new untyped dependency is introduced.
# `aoe2rec_py` (PyPI: `aoe2rec-py`, imported as `aoe2rec_py`, T013) ships a PyO3 extension module
# with no `py.typed` marker and no stubs. mypy's module globs are prefix-on-dot, not substring, so
# the entry has to be `aoe2rec_py.*` — a bare `aoe2rec.*` never matched the real import and was
# dead configuration once `aoe2rec_py.*` was added beside it; `warn_unused_configs` (T379) is what
# surfaced that, and it stays enabled to catch the next one the same way.
module = ["aoe2rec_py.*", "mgz.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
