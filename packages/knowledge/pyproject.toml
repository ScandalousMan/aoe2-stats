[project]
name = "aoe2stats-knowledge"
version = "0.1.0"
description = "Versioned, offline game knowledge — units, buildings, technologies, civilisation effects — queried by build and civilisation."
requires-python = ">=3.13,<3.14"
dependencies = [
  "aoe2stats-core",
]

[tool.uv.sources]
aoe2stats-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2stats_knowledge"]

[tool.hatch.build.targets.wheel.force-include]
"snapshots" = "aoe2stats_knowledge/snapshots"
"packs" = "aoe2stats_knowledge/packs"
