[project]
name = "aoe2stats-knowledge"
version = "0.1.0"
description = "Versioned, offline game knowledge — units, buildings, technologies, civilisation effects — queried by build and civilisation."
requires-python = ">=3.13,<3.14"
dependencies = [
  "aoe2stats-core",
]

[tool.uv.sources]
aoe2stats-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2stats_knowledge"]
# `src/aoe2stats_knowledge/{snapshots,packs}` are symlinks to the two directories below, kept so an
# editable dev install (which never applies force-include) still resolves them at runtime relative to
# `__file__`. A real, non-editable wheel build's default `packages` scan follows those symlinks and
# duplicates the same files at the paths `force-include` already forces below — hatchling then refuses
# with "A second file is being added to the wheel archive at the same path". Hit in production
# 2026-09-28 (PR #90's post-merge deploy): `uv sync --no-editable` builds the wheel directly from this
# source tree and follows the symlinks, unlike `uv build`'s sdist round-trip, which does not. Excluding
# the two symlinks from `packages` leaves `force-include` the only source of these files in a real
# wheel — see https://hatch.pypa.io/1.8/config/build/#forced-inclusion, the note on paths nested
# inside `packages`.
exclude = [
  "src/aoe2stats_knowledge/snapshots",
  "src/aoe2stats_knowledge/packs",
]

[tool.hatch.build.targets.wheel.force-include]
"snapshots" = "aoe2stats_knowledge/snapshots"
"packs" = "aoe2stats_knowledge/packs"

# uv caches the wheel it builds for a local package and, by default, rebuilds it only when this
# file's modification time changes (https://docs.astral.sh/uv/reference/settings/#cache-keys). A
# non-editable install (`uv sync --no-editable`, the deployment builder's install) in a checkout
# that is reused rather than cloned fresh therefore reinstalls a stale wheel after a commit that
# adds a snapshot or edits a module but leaves this file untouched. Measured 2026-10-30: a warm
# cache from 906004ce, then a checkout of 193f7ef2 (which adds `aoe2techtree-180059-civilisations-53`),
# installed 9 of the 10 snapshot directories; `UV_NO_CACHE=1` installed all 10. The globs below make
# every file the wheel ships part of the key, including what `force-include` pulls from
# `snapshots/` and `packs/`; uv then also notices an added, deleted or back-dated file.
# `tests/architecture/test_wheel_cache_keys.py` keeps each workspace member's list in step with its
# wheel target.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**" },
  { file = "snapshots/**" },
  { file = "packs/**" },
]
