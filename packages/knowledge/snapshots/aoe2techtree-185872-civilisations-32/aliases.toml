# Entity aliases for build 185872 (T767, FR-022d, 2026-10-22): the first `aliases.toml`.
#
# Every identifier SiegeEngineers aoc-reference-data's `objects` table (data/datasets/100.json,
# the Definitive Edition dataset, repository head commit 5c59f163b41f757c2d4c9452fca034ec9c4e9d6c) names exactly as a
# unit or building of the vendored pack, with or without an orientation qualifier in
# parentheses ((up.), (down.), (hori.), (vert.)), and that `rules.json` does not itself name.
# The source has no licence, so each pair is a hand-transcribed fact (FR-031) and the file is not
# vendored. `source_name` is the table's string verbatim; `target` is the pack's entity of the
# same kind whose name equals it once the qualifier is removed, and only when exactly one does.
#
# Not aliased, on purpose: the differently named gates (Fortified Gate, Sea Gate, City Gate,
# Paifang Gate, Trowulan Gate), which FR-022d does not alias by name; an object whose parenthesis
# is not an orientation ("Trade Cart (Full)"); an object whose name matches two pack entities
# ("Town Center" is the pack's 109 and 621); and an object whose name differs from the pack's only
# by the line break the pack's string carries (the pack writes "Archery<br>\nRange", the table
# "Archery Range"), which this task did not read as the same name. None of the three committed
# recordings carries one of those identifiers: the only identifiers they place that the pack
# does not name are 490 and 673, both "Gate".

