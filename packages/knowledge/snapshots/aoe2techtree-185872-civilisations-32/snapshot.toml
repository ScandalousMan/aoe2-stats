# The fourth knowledge snapshot for game build 185872 (T768, 2026-10-22): it models thirty-two
# civilisations, the twenty of the third (`aoe2techtree-185872-civilisations-20`, T746 and T767) and
# twelve more (batch B of Phase 8). A promoted snapshot is never edited (FR-025), so this one names
# the digest it supersedes: resolution by build now answers this snapshot, and the first three stay
# installed, promoted and loadable by their full identity so that the analyses published under them
# still reproduce their own bytes (SC-005). An analysis of a build 185872 recording published under
# any of them names a digest that is no longer the current one, so it is recomputed under this
# snapshot on the analyzer's next pass, as the contract's staleness rule says.
#
# Same source, same pack revision (`packages/knowledge/packs/aoe2techtree-3bb43b1/`), same
# normaliser version (2): `rules.json`, `aliases.toml` and `disagreements.toml` are the third
# snapshot's, byte for byte. What is new is `effects.toml` (twelve civilisations and the three open
# rows they leave). The label states the build and how many civilisations the snapshot models, so
# the chain reads in order without opening this file.
[snapshot]
source = "aoe2techtree"
source_version = "3bb43b1439eef88dfe7fe892d7f7dc41ac9dd76f"
describes_build = 185872
digest = "sha256:c24448836cade9ff724ac32935a52280a447df7278cb8cfe3f7cecd58dbf37ae"
promoted = true
supersedes = "sha256:a4f213b6e84f90ee88a916929a136165c3979f214a191556877669dd0a92b4db"
normaliser_version = 2
civilisations_modelled = ["Franks", "Teutons", "Persians", "Saracens", "Malians", "Tatars", "Slavs", "Sicilians", "Britons", "Goths", "Japanese", "Chinese", "Byzantines", "Turks", "Vikings", "Mongols", "Celts", "Spanish", "Aztecs", "Mayans", "Huns", "Koreans", "Italians", "Hindustanis", "Incas", "Magyars", "Portuguese", "Ethiopians", "Berbers", "Khmer", "Malay", "Burmese"]

# FR-030's validation record. The `rules.json`, `aliases.toml` and raw-id halves are the third
# snapshot's and are validated there (and no more than there); this record is for what is new:
# `effects.toml`'s twelve civilisations.
[validation]
method = "second-reading-checked-against-release-notes"
checked_against = """\
the vendored pack's own English strings, \
packages/knowledge/packs/aoe2techtree-3bb43b1/strings.en.json (the help_string_id text of each of \
the twelve new civilisations, and the help strings of the units, buildings and technologies a class \
name was resolved from), read twice: once to transcribe each bonus, once to resolve each selector \
against rules.json and to check every bullet is accounted for; and the publisher's release notes \
for build 185872, \
https://www.ageofempires.com/news/age-of-empires-ii-definitive-edition-update-185872/ \
(datePublished 2026-09-22T10:16:33-07:00, dateModified 2026-09-23T08:59:03-07:00), fetched and \
read on 2026-10-22 (the Civilization Balance section in full). Every value the pack \
does not size was searched, in the order FR-022c gives, in the publisher's notes of every \
Definitive Edition update page the site's sitemap lists (77 pages, fetched 2026-10-22), and the \
values they state are transcribed with the update id in the row: the Portuguese team bonus \
excludes Age Up (update 73855), the Ethiopians' Outposts lose their stone cost (update 81058), \
the Koreans' discount reaches the War Wagon (update 87863) and the Incas' food discount lists its \
units (update 81058, current figures in update 177723). The two values no page states are open \
rows of specs/006-replay-analysis-foundations/owner-readings.md: the food that replaces the \
Magyar Huszar's gold (Corvinian Army; update 95810 names the effect) and the Militia-line's gold \
(Forced Levy; no page names it)\
"""
performed_by = "the T768 implementer (an AI agent working for the repository owner), by direct reading; no person has reviewed it yet"
performed_at = "2026-10-22"
not_checked = """\
No value was compared with the game or with any second source that is independent of the pack: \
the bonuses, the baseline costs, times and ages in rules.json and the strings they are read from \
all come from the one vendored pack (research.md D3: no second source is lawful to vendor), so \
this is a second reading of one source and not independent validation. The release notes can only \
show a change the publisher chose to write down; a bonus change they omit cannot be detected from \
them. Read in full: the Civilization Balance section. The rest of the page was searched for the \
twelve civilisations' names and for cost, time, bonus and discount wording, not read line by \
line. The notes name Huns (Atheism; a technology tree display fix), Koreans \
(Gambesons, Turtle Ship hit points), Italians and Portuguese (Mounted Crossbowmen gained, Cavalry \
Archers lost; Redemption and the Organ Gun's train time for the Portuguese), Magyars (the Magyar \
Huszar's train time) and, once, the Khmer (a scripting note on their farm drop-off bonus); the \
Hindustanis, Incas, Ethiopians, Berbers, Malay and Burmese are not named anywhere on the page. Changes to which technologies and units a civilisation can reach are not bonuses and are \
not rows; the tree in rules.json (normaliser version 2) answers them. Two availability rows state \
what only a bonus can: the Italians' Condottiero and the Berbers' Genitour for the owner's team \
(the pack's own unit strings say 'Trainable by ... and their allies'), and the Malay's Docks and \
Harbors once Thalassocracy is researched. The Berbers' Elite Genitour technology (599) is listed \
as available to allies by inference from the Elite Genitour unit's string and is not stated \
about the technology. Kasbah (Team Castles work +25% faster) is the one bonus the effect model \
cannot express, because it needs a researched technology and the owner's team together and an \
effect carries one condition; it is refused for the Berbers' own Castle and an ally's Castle \
is not refused (a refusal row is scoped to its owner), so an ally's Castle production time is \
answered at the baseline whether or not Kasbah was researched. The Koreans' 'tower upgrades' are \
read as the three technologies that upgrade to or unlock a tower (Guard Tower, Keep, Bombard \
Tower); Arrowslits, Murder Holes and Hoardings are not read as tower upgrades. Classes were \
resolved from the pack's help strings or production sites, not from a definition; a unit the pack \
gives no description (Ratha 1759 and 1761, five unnamed ids) is not in any class, so the Bengalis' \
Ratha is not sped by the Magyars' team bonus. The open values this snapshot leaves are in \
specs/006-replay-analysis-foundations/owner-readings.md. The transcription was not blind: the \
implementer had read the third snapshot's effects.toml to learn the file's shape and carried its \
twenty civilisations from it; the twelve new civilisations were transcribed from the strings and \
rules.json.\
"""

