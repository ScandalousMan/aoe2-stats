# snapshot's and are validated there (and no more than there); this record is for what is new:
# `effects.toml`'s twelve civilisations and three replaced rows.
[validation]
method = "second-reading-checked-against-release-notes"
checked_against = """\
the vendored pack's own English strings, \
packages/knowledge/packs/aoe2techtree-3bb43b1/strings.en.json (the help_string_id text of each of \
the twelve new civilisations and of the Cumans and the Berbers, and the help strings of the units, \
buildings and technologies a class name was resolved from), read twice: once to transcribe each \
bonus, once to resolve each selector against rules.json and to check every bullet is accounted \
for; and the publisher's release notes for build 185872, \
https://www.ageofempires.com/news/age-of-empires-ii-definitive-edition-update-185872/ \
(datePublished 2026-09-22T10:16:33-07:00, dateModified 2026-09-23T08:59:03-07:00), fetched and \
read on 2026-10-26 (the Balance Changes section in full, the rest searched for the fourteen \
civilisations' names). Every value the pack does not size was searched, in the order FR-022c \
gives, in 171 pages of the publisher's site (every Age of Empires II Definitive Edition update, \
hotfix and preview page its post sitemaps list, the build's own and the Saxons, Varangians and \
Danes deep dives), fetched 2026-10-26: update 177723 states that the Jurchens' bonus applies to \
Murder Holes, that the Muisca's Settlement discount is 33% and Huaracas' train bonus 50%; update \
169123 that the Khitans' bonus is 15% and Careening and Dry Dock are free for the Wu; the Saxons \
deep dive that the Saxons' Foot Soldiers and Varangian Guards cost less per Town Center or Castle \
controlled. The values no page states are open rows of \
specs/006-replay-analysis-foundations/owner-readings.md: whether the Saxons' ranged foot units \
are Foot Soldiers, and whether nine technologies of the Jurchens' tree (Chemistry, Ballistics, \
Fletching, Bodkin Arrow, Bracer, Siege Engineers, Hoardings, Arrowslits, Fortified Bastions), the \
ones the criterion in the header of effects.toml matches and no source classes, are Siege or \
Fortification upgrades for the Jurchens\
"""
performed_by = "the T770 implementer (an AI agent working for the repository owner), by direct reading; no person has reviewed it yet"
performed_at = "2026-10-26"
not_checked = """\
No value was compared with the game or with any second source that is independent of the pack: \
the bonuses, the baseline costs, times and ages in rules.json and the strings they are read from \
all come from the one vendored pack (research.md D3: no second source is lawful to vendor), so \
this is a second reading of one source and not independent validation. The release notes can only \
show a change the publisher chose to write down; a bonus change they omit cannot be detected from \
them. Read in full: the Balance Changes section. The rest of the page was searched for the \
civilisations' names and for cost, time, bonus and discount wording, not read line by line. The \
notes name the Shu (War Chariot cost and time, Treadmill Crane), Wei (Xianbei Raider cost), \
Jurchens (Grenadier cost), Mapuche ((Elite) Bolas Rider cost), Muisca (Temple Guard attack), Tupi \
((Elite) Blackwood Archer cost) and, for the technology tree display, the Khitans; the Georgians \
and the Wu are not named anywhere on the page, and the Saxons, Varangians and Danes are added by \
it. Classes were resolved from the pack's help strings or production sites, not from a \
definition. Six readings are inferences no source states, flagged in their rows: Shu's \
'Archery Unit technologies at the Blacksmith' are the six archer technologies; Tupi's 'upgrades' \
and the Danes' 'upgrades' are each every technology the pack places at the named buildings; the \
Saxons' Foot Soldiers include every Infantry unit, and the Petard (440), which the pack calls a \
Demolition Siege Weapon, is outside the class and is not refused; the Khitans' bonus reaches the \
Imperial Skirmisher, which the Khitans' tree does not offer, so no game reading can reach it; and \
the Heavy Cavalry Archer's age is set with its upgrade's. Two more readings are \
unvalidated, flagged in their rows: the Persians' Kamandaran, read as a cost of 50 wood and no gold \
in total, and the Cumans' count table for the additional Town Center (two or more Town Centers \
controlled put the next one in the Castle Age). No source states either, and no game reading \
checks them. The Mapuche Settlements' own training \
times (update 170934) are not carried, since production_time holds one time per unit. The \
Butalmapu row discounts every unit the pack produces at the Castle but the Trebuchet and the \
Petard; whether the game also discounts the Krepost's Konnik and the Donjon's Serjeant is not \
stated by any source and is not modelled. The Cumans' Town Center count covers the three \
identifiers rules.json names; the others that aoc-reference-data calls 'Town Center' (measured in \
docs/data-sources.md) are in no pack. Changes to which technologies and units a civilisation can reach are not bonuses and are \
not rows; the tree in rules.json (normaliser version 2) answers them. The transcription was not \
blind: the implementer had read the fifth snapshot's effects.toml to learn the file's shape and \
carried its forty-four civilisations from it; the twelve new civilisations were transcribed from \
the strings and rules.json.\
"""

