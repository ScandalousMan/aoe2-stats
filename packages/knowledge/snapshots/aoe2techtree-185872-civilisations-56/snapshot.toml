# The sixth knowledge snapshot for game build 185872 (T770, 2026-10-26): it models fifty-six
# civilisations, every civilisation of the vendored pack: the forty-four of the fifth
# (`aoe2techtree-185872-civilisations-44`, T746 and batches A to C) and twelve more (batch D of
# Phase 8). A promoted snapshot is never edited (FR-025), so this one names the digest it
# supersedes: resolution by build now answers this snapshot, and the first five stay installed,
# promoted and loadable by their full identity so that the analyses published under them still
# reproduce their own bytes (SC-005). An analysis of a build 185872 recording published under any of
# them names a digest that is no longer the current one, so it is recomputed under this snapshot on
# the analyzer's next pass, as the contract's staleness rule says.
#
# Same source, same pack revision (`packages/knowledge/packs/aoe2techtree-3bb43b1/`), same
# normaliser version (2): `rules.json`, `aliases.toml` and `disagreements.toml` are the fifth
# snapshot's, byte for byte. What is new is `effects.toml`: twelve civilisations, and three rows of
# the fifth that the effect model could not express then and can now (the Cumans' additional Town
# Center, Cuman Mercenaries, the Berbers' Kasbah), replaced in place. The label states the build
# and how many civilisations the snapshot models.
