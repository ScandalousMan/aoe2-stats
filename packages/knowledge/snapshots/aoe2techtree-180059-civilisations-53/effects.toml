# Civilisation effects for build 180059, the second snapshot of the build (T773, 2026-10-28).
#
# This snapshot supersedes `aoe2techtree-180059` (`snapshot.toml`, `supersedes`), which models six
# civilisations: a promoted snapshot is never edited (FR-025), so modelling the other forty-seven
# could only ship as a second snapshot of the build. Resolution by build now answers this one; the
# first stays installed, promoted and loadable by identity so that the analyses published under it
# still reproduce their own bytes (SC-005).
#
# **Source.** The pack build 180059 is derived from, `packages/knowledge/packs/aoe2techtree/`
# (aoe2techtree commit b9d494df6921d4080df69b22f9dbb7a4d1dcd9f0), not the one the build 185872
# snapshots read (`packages/knowledge/packs/aoe2techtree-3bb43b1/`). It lists fifty-three
# civilisations: the fifty-six of the other pack without the Saxons, Varangians and Danes, which the
# Viking Sagas added in build 185872. `rules.json` is derived again from it under normaliser version
# 2 (T763), `aliases.toml` and the raw-id table at the foot of this file are read again for it, and
# `disagreements.toml` is the normaliser's own output over it (nothing recorded).
#
# **The carry rule (T773).** A row of `aoe2techtree-185872-civilisations-56` (T770, digest
# sha256:b247190134e69b46e5111487db0ff98514df9ceb41bcd4f926a7278fbedd952f) is carried here only where
# all three hold: the bullet's string is byte-identical under the same key in both packs; every
# selector and condition identifier resolves to the same identifier, with the same name, in this
# snapshot's `rules.json`, and a class defined by where a building produces it has the same members
# in both packs (the entities the pack produces at the building, compared set by set); and build
# 185872's release notes (https://www.ageofempires.com/news/age-of-empires-ii-definitive-edition-update-185872/,
# the Balance Changes section read in full on 2026-10-28) name no change to the bonus or to an entity
# it selects. A note that only grants or removes a civilisation's access to an entity ("Gain access
# to", "Lose access to") is not a change to the entity: which entities a civilisation reaches is
# `rules.json`'s question, never a bonus's. The third condition was also checked the other way, by
# comparing the two packs' `rules.json` entity by entity: the only shared entities that differ are
# the ones the notes name (a cost, a time, a name), and no carried row selects one of them.
# Each carried row's `validated_by` says so and names the source snapshot's digest. Every other row
# is transcribed from this pack's strings, its `validated_by` saying which condition it failed.
#
# **What this file holds.** 216 rows carried, 79 transcribed again because a condition
# failed (180 bonuses carried and 69 transcribed, a bonus being the rows that share
# one bullet), two rows carried byte for byte from `aoe2techtree-180059` itself (Franks' Bearded Axe
# and Teutons' Barracks and Stable armour, bullets this pack has and the build 185872 pack does not;
# the earlier snapshot of the same build and pack revision read the same strings), and one row written
# new (Gurjaras' Docks garrison capacity, a bullet the build 185872 notes remove). The forty-seven
# civilisations the first snapshot did not model are in here for the first time; the six it did are
# re-derived under the same rule, so the rows the first snapshot held for them are not copied from it
# except the two named.
#
# **Why a row was transcribed rather than carried.** Seven kinds of failure, each named in the row:
#   - the bullet's string differs (Franks' Ordonnance Companies replaces Bearded Axe; the Byzantines'
#     Logistica, the Mapuche's Malon and the Vikings' Bogsveigar read differently, and are rows here
#     under this pack's wording; the Bohemians' Wagenburg Tactics, the Vietnamese's Archery Range
#     units, the Vikings' Chieftains and the Wu's +55 food read differently and are bullets with no
#     row; the Teutons' Barracks and Stable armour is one of the two rows named above);
#   - a selected identifier is not in this pack (the Mounted Crossbowmen, the Varangian Guard and the
#     other Viking Sagas entities, the technologies the new pack adds): removed from the selector;
#   - the Longship is the Longboat in this pack: the same identifiers under another name;
#   - the entities a class resolves to by where they are produced are not the same set;
#   - build 185872's release notes name a change to a selected entity (the Onager, the Lou Chuan, the
#     Hussite Wagon, the Grenadier, the Organ Gun, the Conquistador, the Missionary, the Turtle
#     Ship, the Ratha, the Man-at-Arms and Champion damage, the Rattan Archer, the Demolition Ship, the
#     Fortified Church and the Docks garrison bonus of the Gurjaras);
#   - this pack's `rules.json` differs from the other's for a selected entity (the same changes, seen
#     in the data: a cost, a time or a name);
#   - the civilisation is not in this pack (Saxons, Varangians, Danes): no row.
# The values of a transcribed row are the bullet's own figures; its selector is the one the source
# row resolved, re-checked against this pack as its `validated_by` records.
#
# **Not read here.** The Fandom wiki is the owner's, never an agent's (docs/data-sources.md section 6);
# every value this file needs is stated by the pack's strings or by a row of the source snapshot, so
# no sheet row of `specs/006-replay-analysis-foundations/owner-readings.md` is answered by this file.
# The open rows of that sheet for build 185872 are open here too for the bonuses this snapshot carries
# (T774 carries the owner's readings back); `packages/knowledge/tests/test_whole_pack_coverage.py`
# holds the list per build.
#
# **Bullets with no row** (a class the pack does not enumerate, on a field not carried, or a resource
# or start condition no entity carries): the earlier snapshots' headers list them, and the same
# bullets carry no row here. `packages/knowledge/tests/test_effects_180059_civilisations_53.py` holds
# the closed list by civilisation and asserts that every bullet of the pack is a row or on it.
#
# **Classification, free technologies, team bonuses on another civilisation's entity, work speed
# that stacks, "available one age earlier":** as in `aoe2techtree-185872-civilisations-56`, whose
# header states them and whose rows this file follows.
#
# **The raw-id table** (`[[civilisation_id]]`, foot of the file) is read again for this pack and
# names every one of its fifty-three civilisations.

