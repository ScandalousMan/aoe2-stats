# Entity aliases for build 180059 (T773, FR-022d, 2026-10-28): read again for the pack this snapshot
# derives from (`packages/knowledge/packs/aoe2techtree/`, commit b9d494df6921d4080df69b22f9dbb7a4d1dcd9f0),
# not copied from `aoe2techtree-185872-civilisations-56`.
#
# Every identifier SiegeEngineers aoc-reference-data's `objects` table (data/datasets/100.json,
# the Definitive Edition dataset, repository head commit 9ee0fe29fa05f176575ce6e3befd21a116d27e12, read 2026-10-28) names exactly as a
# unit or building of that pack, with or without an orientation qualifier in
# parentheses ((up.), (down.), (hori.), (vert.)), and that this snapshot's `rules.json` does not
# itself name. The source has no licence, so each pair is a hand-transcribed fact (FR-031) and the
# file is not vendored. `source_name` is the table's string verbatim; `target` is the pack's entity
# of the same kind whose name equals it once the qualifier is removed, and only when exactly one
# does.
#
# Not aliased, on purpose, as in the build 185872 snapshots: the differently named gates (Fortified
# Gate, Sea Gate, City Gate, Paifang Gate, Trowulan Gate), which FR-022d does not alias by name; an
# object whose parenthesis is not an orientation ("Trade Cart (Full)"); an object whose name matches
# two pack entities ("Town Center" is the pack's 109 and 621); and an object whose name differs
# from the pack's only by the line break the pack's string carries. This pack names two fewer
# entities than the build 185872 one that the table also names exactly (units 931 and 1298), so
# this file holds 71 aliases and that one 73. The two identifiers the second committed
# recording places that the pack does not name, 490 and 673, are both "Gate" and are aliased below.

