# Civilisation effects for build 185872, second snapshot (T746, 2026-10-18).
#
# This snapshot supersedes `aoe2techtree-185872` (`snapshot.toml`, `supersedes`), whose
# `effects.toml` models no civilisation on purpose: a promoted snapshot is never edited (FR-025), so
# modelling civilisations for the build could only ship as a second snapshot of it. Its `rules.json`
# is the first's, byte for byte (the same pack revision, the same normaliser); only this file and
# the identity differ.
#
# **Scope.** Raw civilisation ids 23 and 37, the two the committed build 185872 recording
# (`tests/fixtures/replays/AgeIIDE_Replay_511523321.zip`) seats, and every civilisation the build
# 180059 snapshot models: eight civilisations. Raw ids 5, 10, 49 and 51, which production's analysis
# of match 512927942 also seats, are out of scope and stay the aggregate gap report's backlog
# (research.md D5): they are not named here and resolve to `unknown-civilisation-<id>`.
#
# **Transcribed again, not carried over.** Every row below was written from the English strings of
# the pack this snapshot is derived from, `packages/knowledge/packs/aoe2techtree-3bb43b1/
# strings.en.json`, and checked against the build 185872 release notes (`snapshot.toml`'s
# `[validation]` says what was read and what was not). The build 180059 snapshot's `effects.toml` was
# opened to learn the file's row shape and compared with this one afterwards; no row, operand or
# selector was taken from it, each was derived from the strings and `rules.json`, so the transcription
# is not blind to it. Where the two differ the difference is deliberate: selectors here name every
# entity the pack lists as produced at the bullet's building instead of the owner's tree, and
# Barracks Units has the units and not the building. Two bonuses changed between the two packs
# and both changes are in the release notes: Franks lose Bearded Axe and gain Ordonnance Companies,
# and the Teutons' armour bonus is now "Infantry and Mounted Units" instead of "Barracks and Stable
# Units". The other six civilisations' strings are identical in both packs.
#
# **The raw-id table** (`[[civilisation_id]]`, foot of the file) was taken again from the source
# `docs/data-sources.md` section 6 assesses, SiegeEngineers aoc-reference-data, not from the build
# 180059 snapshot; each entry records what was read and what corroborates it.
#
# **Classification, as in the contract** (contracts/knowledge-base.md, "Civilisation
# qualification"). A bonus that adjusts a field this knowledge base carries (cost, production time,
# age requirement, produced-at, availability) is `modelled = "yes"`, with a `condition` when it holds
# only in an age, once a technology is researched or on the owner's team. A bonus whose amount the
# pack's string never states, or that the effect model cannot express, is `modelled = "no"` with a
# reason: the field it touches stays gapped and is never answered at the baseline. A bonus on a
# field this knowledge base does not carry (hit points, attack, armour, line of sight, range, speed,
# gather rate...) touches no value it answers; where its target is an enumerable entity it is a
# `modelled = "no"` row saying so, and where its target is only a class of unit the pack does not
# enumerate it cannot be a row (`selector` is never empty and never a class name) and is listed
# below instead.
#
# **Selectors.** Each names every entity the pack lists as produced at the building the bullet
# names, or the units the bullet names, resolved from `rules.json` and recorded in the row's own
# `validated_by`. A selector is not narrowed to a civilisation's tree: which entities a civilisation
# can reach is `available_to`'s question, and a team effect reaches civilisations the owner's tree
# says nothing about.
#
# **Bullets with no row (a class the pack does not enumerate, on a field not carried):**
#   Franks: "Foragers work +15% faster"; "Mounted Units +20% HP starting in Feudal Age".
#   Teutons: "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age"; "Ironclad (Siege
#     Weapons +4 melee armor)"; "Team Bonus: Units more resistant to conversion".
#   Persians: "Start with +50 wood and +50 food".
#   Saracens: "Camel Units +25% HP"; "Team Bonus: Foot Archers and Skirmishers +2 attack vs. buildings".
#   Malians: "Farimba (Cavalry +5 attack)".
#   Tatars: "Livestock animals last +50% longer"; "Units deal +25% damage when fighting from higher
#     elevation"; "Team Bonus: Mounted Archers +2 line of sight".
#   Slavs: "Farmers work +15% faster"; "Druzhina (Infantry deals trample damage)"; "Team Bonus:
#     Military buildings (except Castles) provide +5 population space".
#   Sicilians: "Start with +100 stone"; "Farm upgrades provide +125% additional food"; "Soldiers
#     receive -40% bonus damage".
# **A bullet whose entity is real but whose baseline already answers it:** Persians' "Can build
# Caravanserai in Imperial Age": the Caravanserai (building 1754) has age_requirement 4 in
# `rules.json`, the Persians' tree agrees, and an entity that resolves is available at the baseline.
#
# **Four bonuses stay refused on a field this knowledge base carries**, each with its reason in the
# row, and are the open backlog of this snapshot: Persians' Kamandaran and Slavs' Detinets (the pack
# never states the wood amount that replaces the gold or stone), Sicilians' "Fortifications built
# +50% faster" (the pack never lists which buildings that names) and the availability half of
# Sicilians' "Can build Donjon in Dark Age, replaces Watch Tower-line" (the effect model cannot say
# an entity is unavailable). Each makes a query for that civilisation and entity a gap with cause
# `effect-not-modelled`; none is answered at the baseline.
#
# **Free technologies.** A technology a bonus makes free is granted on reaching its age and is never
# researched, so each such bullet has two rows, cost and production time, both set to zero.

# ---------------------------------------------------------------------- Franks

[[effect]]
civilisation = "Franks"
source_key = "120151"
source_text = "Mill technologies free"
modelled = "yes"
field = "cost"
operation = "set"
operand = { food = 0, wood = 0 }
selector = [
  { kind = "technology", id = "12" },
  { kind = "technology", id = "13" },
  { kind = "technology", id = "14" },
  { kind = "technology", id = "1012" },
  { kind = "technology", id = "1013" },
  { kind = "technology", id = "1014" },
]
validated_by = """\
Weak form (FR-030): a second reading of the same vendored source, not an independent one \
(research.md D3: the two community datasets are one generation pipeline run twice, and the game's \
own data file is barred by the publisher's usage rules). First reading: \
packages/knowledge/packs/aoe2techtree-3bb43b1/strings.en.json, help_string_id 120151. Second \
reading (T746, 2026-10-18, by the T746 implementer): the same string re-read in full, then checked \
against the build 185872 release notes \
(https://www.ageofempires.com/news/age-of-empires-ii-definitive-edition-update-185872/), whose \
Franks entry removes Bearded Axe, adds Ordonnance Companies (Mounted Crossbowmen cost -40% gold; \
400 food 250 gold, 40 seconds), raises Throwing Axeman range and names no other change to a Franks \
bonus; the pack's string carries both the removal and the addition. Selector and operand: resolved \
'Mill technologies' to every technology rules.json lists as produced_at building 68 (Mill): Crop \
Rotation 12, Heavy Plow 13, Horse Collar 14 and Domestication 1014, Pastoralism 1013, Transhumance \
1012. The pack's trees offer the last three to Khitans alone, so no Franks query reaches them; \
they stay in the selector because which technologies a civilisation can reach is available_to's \
question, never a selector's to pre-filter. Their costs carry food and wood only, so the operand's \
two keys cover every resource of every selected technology.\
"""

