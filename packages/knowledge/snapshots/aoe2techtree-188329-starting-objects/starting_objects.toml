# Starting objects for build 188329 (T925, FR-026, 2026-11-17): the units and buildings a participant
# starts with, per civilisation and lobby preset. The snapshot supersedes
# `aoe2techtree-188329-civilisations-56`, whose `rules.json`, `effects.toml` and `aliases.toml` it
# carries byte for byte; it adds this file and nothing else.
#
# **What is stated.** The vendored pack's civilisation help strings
# (`packages/knowledge/packs/aoe2techtree-e56728e/strings.en.json`) state six bonuses that add an
# object at the start; each is a `[[starting_object]]` with the string's key and the bullet
# verbatim. The bonuses that change a stockpile ("Start with +50 gold") are not objects and are not
# here: the decoded starting attributes carry them. A bullet that spawns objects later ("Town
# Centers spawn 2 Villagers when the next Age is reached", "First Crusade") is not a starting
# object and is not here. The pack's bullets carry no lobby preset, so each row's preset is
# `any`: a statement about the bullet, not a verified fact about the game, which is why every
# bonus also has an `[[open]]` row below.
#
# **What is not stated, and is therefore open.** The pack carries no baseline (what every
# participant starts with) and no lobby preset. No source ruled in docs/data-sources.md section 6
# states them, so each is an `[[open]]` row naming the owner request that reads it
# (specs/008-match-reconstruction/owner-readings.md, O8). A consumer that needs a total reads a
# non-empty `open` as a knowledge gap and adds nothing by default (FR-026).
#
# Every row is a `bonus`: it adds to a baseline and is never a full starting set. The pack's
# bullets give no entity id ("Villagers" is not unit 83, the male Villager, by inference), so no
# row carries a `unit_id`. A `baseline` row would name civilisation "*"; none exists (O8.1).

