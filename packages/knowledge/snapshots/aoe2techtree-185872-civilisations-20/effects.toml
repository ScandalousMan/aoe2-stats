# Civilisation effects for build 185872, third snapshot (T767, 2026-10-22).
#
# This snapshot supersedes `aoe2techtree-185872-civilisations` (`snapshot.toml`, `supersedes`), as
# that one superseded `aoe2techtree-185872`: a promoted snapshot is never edited (FR-025), so
# modelling twelve civilisations more could only ship as a third snapshot of the build. Resolution
# by build now answers this one; the other two stay installed, promoted and loadable by identity so
# that the analyses published under them still reproduce their own bytes (SC-005). Same pack
# revision (`packages/knowledge/packs/aoe2techtree-3bb43b1/`), same normaliser except that
# `rules.json` is derived again under normaliser version 2 (T763), which adds each civilisation's own
# tree; `aliases.toml` is new (T761). `disagreements.toml` is the second's, unchanged.
#
# **Scope.** Twenty civilisations: the eight of T746 (Franks, Teutons, Persians, Saracens, Malians,
# Tatars, Slavs, Sicilians) and batch A's twelve (Britons, Goths, Japanese, Chinese, Byzantines,
# Turks, Vikings, Mongols, Celts, Spanish, Aztecs, Mayans). The 36 others are batches B, C and D
# (T768 to T770) and resolve to `civilisation-not-modelled`.
#
# **Carried, not transcribed again.** T746 read its eight civilisations' rows from the English
# strings of this same pack revision for this same build, so every one of them is carried byte for
# byte (`test_effects_185872_civilisations_20.py` asserts it row by row) except the three sources
# below, which FR-022c and T763's extended model made it possible to take again. The twelve new
# civilisations were transcribed from the same strings, each row's selector resolved from this
# snapshot's `rules.json` and recorded in its own `validated_by`, and checked against the build
# 185872 release notes (`snapshot.toml`'s `[validation]` says what was read and what was not).
#
# **The four refused rows of T746, taken again** (FR-022c: the pack, then the publisher's notes for
# every build since the bonus appeared, then the owner's sheet):
#   - Persians' Kamandaran: update 162286 states the Archer-line cost after it (50 wood), and update
#     34699 the earlier figure; now `modelled = "yes"`. The reading as a total is the row's weakest
#     link and says so.
#   - Sicilians' Donjon bullet: `available_to` set false for the Watch Tower line and true for the
#     Donjon (T763); both agree with the tree of normaliser version 2.
#   - Sicilians' "Fortifications built +50% faster": the notes state the Donjon (update 111772: 83
#     seconds after the bonus) and the Castle (updates 81058, 111772); those two are modelled. The
#     tower line, the Bombard Tower and the Krepost stay refused and are an open row of
#     `owner-readings.md`.
#   - Slavs' Detinets: update 61321 repeats the pack's sentence and no note sizes the wood; it stays
#     refused and an open row.
#
# **New refusals, each an open row of `specs/006-replay-analysis-foundations/owner-readings.md`:**
#   - Chinese "Technologies cost -5/10/15%": whether the Castle Age (102) and Imperial Age (103)
#     advances are discounted is stated nowhere (the Feudal Age advance is researched in the Dark
#     Age, which the age table has no entry for, so it is the baseline either way).
#   - Turks "Gunpowder technologies costs -50%": which technologies that names is stated nowhere;
#     the candidates are 10, 64, 369 and 376, the Turks' technologies that concern a unit or
#     building the pack's Chemistry string lists as a Gunpowder Unit or its upgrade.
#   - Turks' team bonus "Gunpowder Units train +25% faster": the units the pack calls Foot Gunner or
#     Mounted Gunner (46, 557, 771, 773) are not stated to be Gunpowder Units. The effect model
#     scopes a modelled=no row to its own civilisation, so an ally's query is not refused by it.
#   - Aztecs "Military Units train +15% faster": the pack never defines the class; the units of the
#     Barracks, Archery Range, Stable, Siege Workshop, Castle, Donjon and Krepost are taken from the
#     buildings' own help strings, and the Aztecs' own warships and Monk are open.
#
# **Classes are resolved, never guessed.** "Infantry", "Foot Archers", "Warships" and "Gunpowder
# Units" are not keys of `rules.json`. Each was resolved from what the pack's strings state of each
# unit (the first sentence of its help string, the text at its language name id plus 21000) or from
# where the pack says units are produced, and the list and what it was read from are in the row's
# `validated_by`. A line ("Spearman-line", "Scout Cavalry-line") is the chain the pack's own unit
# strings state ("Upgrades: ..., to Pikeman (Barracks)"). A member the pack does not settle is a
# refusal and an open row, never a guess. An open row lists, for a personal bonus, only the
# entities the civilisation's own tree offers: a personal bonus cannot reach what the civilisation
# cannot field. The modelled=yes selectors are not narrowed to a tree (which entities a civilisation
# can reach is `available_to`'s question).
#
# **Classification, as in the contract** (contracts/knowledge-base.md, "Civilisation
# qualification"). A bonus that adjusts a field this knowledge base carries (cost, production time,
# age requirement, produced-at, availability) is `modelled = "yes"`, with a `condition` when it
# holds only in an age, once a technology is researched or on the owner's team. A bonus whose
# amount the sources never state, or whose scope they never settle, is `modelled = "no"` with a
# reason: the field it touches stays gapped and is never answered at the baseline. A bonus on a
# field this knowledge base does not carry (hit points, attack, armour, speed, range, line of
# sight, gather rate...) touches no value it answers; where its target is enumerable it is a
# `modelled = "no"` row saying so, and where its target is only a class the pack does not
# enumerate it cannot be a row (`selector` is never empty and never a class name) and is listed
# below instead. Work-speed bonuses that stack on one building (Goths' Perfusion and team bonus)
# apply one after the other in file order, each dividing the time.
#
# **The raw-id table** (`[[civilisation_id]]`, foot of the file) names every civilisation of the
# pack, from `aoc-reference-data`'s `civilizations` keys, read again 2026-10-22; each entry records
# what was read and what corroborates it.
#
# **Free technologies.** A technology a bonus makes free is granted on reaching its age and is
# never researched, so each such bullet has two rows, cost and production time, both set to zero.
#
# **Bullets with no row (a class the pack does not enumerate, on a field not carried):**
#   Franks: "Foragers work +15% faster"; "Mounted Units +20% HP starting in Feudal Age".
#   Teutons: "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age"; "Ironclad (Siege
#     Weapons +4 melee armor)"; "Team Bonus: Units more resistant to conversion".
#   Persians: "Start with +50 wood and +50 food".
#   Saracens: "Camel Units +25% HP"; "Team Bonus: Foot Archers and Skirmishers +2 attack vs.
#     buildings".
#   Malians: "Farimba (Cavalry +5 attack)".
#   Tatars: "Livestock animals last +50% longer"; "Units deal +25% damage when fighting from higher
#     elevation"; "Team Bonus: Mounted Archers +2 line of sight".
#   Slavs: "Farmers work +15% faster"; "Druzhina (Infantry deals trample damage)"; "Team Bonus:
#     Military buildings (except Castles) provide +5 population space".
#   Sicilians: "Start with +100 stone"; "Farm upgrades provide +125% additional food"; "Soldiers
#     receive -40% bonus damage".
#   Britons: "Shepherds work +25% faster"; "Foot Archers +1/+2 range in Castle/Imperial Age".
#   Goths: "Hunters carry +15; hunted animals last +20% longer"; "Infantry +1/+2/+3 attack vs.
#     buildings in Feudal/Castle/Imperial Age"; "+10 population space in Imperial Age".
#   Japanese: "Infantry attacks +33% faster starting in Feudal Age".
#   Chinese: "Start with +3 Villagers, but -50 wood and -200 food".
#   Byzantines: "Buildings +10/20/30/40% HP in Dark/Feudal/Castle/Imperial Age".
#   Turks: "Gold miners work +25% faster"; "Gunpowder Units +25% HP"; "Sipahi (Mounted Archers +20
#     HP)".
#   Vikings: "Infantry +20% HP starting in Feudal Age"; "Chieftains (Infantry +5 attack vs. Cavalry,
#     +4 vs. Camel Units)".
#   Mongols: "Hunters work +40% faster"; "Nomads (Lost Houses do not decrease population space)".
#   Celts: "Lumberjacks work +15% faster"; "Livestock animals within Celt unit line of sight cannot
#     be stolen"; "Infantry moves +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age"; "Siege
#     Weapons attack +25% faster"; "Furor Celtica (Siege Weapons +40% HP)".
#   Spanish: "Builders work +30% faster"; "Receive +20 gold for each technology researched";
#     "Gunpowder Units attack +18% faster".
#   Aztecs: "Start with +50 gold"; "Garland Wars (Infantry +4 attack)"; "Team Bonus: Relics generate
#     +33% gold".
#   Mayans: "Start with +1 Villager, but -50 food"; "Resources last +15% longer".
# **A bullet whose entity is real but whose baseline already answers it:** Persians' "Can build
# Caravanserai in Imperial Age": the Caravanserai (building 1754) has age_requirement 4 in
# `rules.json`, the Persians' tree agrees, and an entity that resolves is available at the baseline.

