# The third knowledge snapshot for game build 185872 (T767, 2026-10-22): it models twenty
# civilisations, the eight of the second (`aoe2techtree-185872-civilisations`, T746) and twelve more
# (batch A of Phase 8). A promoted snapshot is never edited (FR-025), so this one names the digest it
# supersedes: resolution by build now answers this snapshot, and the first two stay installed,
# promoted and loadable by their full identity so that the analyses published under them still
# reproduce their own bytes (SC-005). An analysis of a build 185872 recording published under either
# names a digest that is no longer the current one, so it is recomputed under this snapshot on the
# analyzer's next pass, as the contract's staleness rule says.
#
# Same source, same pack revision (`packages/knowledge/packs/aoe2techtree-3bb43b1/`). Three things
# are new: `rules.json` is derived again under normaliser version 2 (T763; it adds each
# civilisation's own tree, so `available_to` answers membership), `aliases.toml` (T761, FR-022d; the
# first one any snapshot carries), and `effects.toml`. `disagreements.toml` is the second's,
# unchanged: the normaliser's own writer output, nothing recorded. The label states the build and
# how many civilisations the snapshot models, so the chain reads in order without opening this file.
[snapshot]
source = "aoe2techtree"
source_version = "3bb43b1439eef88dfe7fe892d7f7dc41ac9dd76f"
describes_build = 185872
digest = "sha256:a4f213b6e84f90ee88a916929a136165c3979f214a191556877669dd0a92b4db"
promoted = true
supersedes = "sha256:becd35a158dafb72c304aeb07bae66347b4442f62d209d8cedb23d0c1f34f004"
normaliser_version = 2
civilisations_modelled = ["Franks", "Teutons", "Persians", "Saracens", "Malians", "Tatars", "Slavs", "Sicilians", "Britons", "Goths", "Japanese", "Chinese", "Byzantines", "Turks", "Vikings", "Mongols", "Celts", "Spanish", "Aztecs", "Mayans"]

# FR-030's validation record. The `rules.json` half is the first snapshot's direct import and is
# validated there (and no more than there); this record is for what is new: `effects.toml`'s twelve
# civilisations and four retaken rows, `aliases.toml`, and the raw-id table.
[validation]
method = "second-reading-checked-against-release-notes"
checked_against = """\
the vendored pack's own English strings, \
packages/knowledge/packs/aoe2techtree-3bb43b1/strings.en.json (the help_string_id text of each of \
the twelve new civilisations, and the help strings of the units, buildings and technologies a class \
name was resolved from), read twice: once to transcribe each bonus, once to resolve each selector \
against rules.json and to check every bullet is accounted for; and the publisher's release notes \
for build 185872, \
https://www.ageofempires.com/news/age-of-empires-ii-definitive-edition-update-185872/ \
(datePublished 2026-09-22T10:16:33-07:00, dateModified 2026-09-23T08:59:03-07:00), fetched and \
read on 2026-10-22 (the Gameplay and Balance Changes sections in full). The four rows T746 refused \
were searched in the publisher's notes of every Definitive Edition update page the site lists, \
fetched 2026-10-22: Kamandaran in updates 34699, 35584, 95810 and 162286; Detinets in update \
61321; the Sicilians' Fortifications bonus in updates 81058 and 111772. The aliases and the raw-id \
table were read from SiegeEngineers aoc-reference-data, data/datasets/100.json (objects and \
civilizations), on 2026-10-22, repository head commit 5c59f163b41f757c2d4c9452fca034ec9c4e9d6c \
(2026-10-19), and the raw-id entries corroborated where a committed recording seats the \
civilisation, entry by entry in effects.toml\
"""
performed_by = "the T767 implementer (an AI agent working for the repository owner), by direct reading; no person has reviewed it yet"
performed_at = "2026-10-22"
not_checked = """\
No value was compared with the game or with any second source that is independent of the pack: \
the bonuses, the baseline costs, times and ages in rules.json and the strings they are read from \
all come from the one vendored pack (research.md D3: no second source is lawful to vendor), so \
this is a second reading of one source and not independent validation. The release notes can only \
show a change the publisher chose to write down; a bonus change they omit cannot be detected from \
them. Read in full: the Gameplay and Balance Changes sections. The rest of the page was searched \
for the twelve civilisations' names and for cost, time, bonus and discount wording, not read line \
by line. The notes name Britons, Goths, Chinese, Byzantines, Celts, Spanish and Vikings among the \
twelve, for access changes (Mounted Crossbowmen, Cranequins, Treadmill Crane, Varangian Guards, \
Gambesons, Cannon Galleons), Byzantine Cataphract damage and the Logistica rewording, Vikings' \
Chieftains rework and the Spanish Conquistador and Missionary costs; Japanese, Turks, Mongols, \
Aztecs and Mayans are not named anywhere on the page. Changes to which technologies and units a \
civilisation can reach are not bonuses and are not rows; the tree in rules.json (normaliser \
version 2) answers them, and the Sicilians' Donjon bullet is the one row that sets availability. \
Older notes were read only for the four retaken rows. Kamandaran is read as a total cost of 50 \
wood and no gold; the notes say 'costs 50 wood' and the pack 'additional wood cost', so that \
reading is the least certain value here and no person has read it in the game. Six class names \
(Infantry, Foot Archers, Warships, Gunpowder Units, Military Units, Technologies) were resolved \
from the pack's help strings or production sites, not from a definition; a unit the pack gives no \
description (Ratha 1759 and 1761, five unnamed ids) is not in any class. The aliases rest on name \
equality with the source and nothing else: where the source and the game disagree about what an \
object is, the alias inherits it. Fifty-six civilisations' raw ids rest on the dataset; only the \
eight of T746 are corroborated by a recording, and the dataset's repository head commit was \
recorded, not the commit that last changed the file. The open values this snapshot leaves are in \
specs/006-replay-analysis-foundations/owner-readings.md. The transcription was not blind: the \
implementer had read the second snapshot's effects.toml to learn the file's shape and carried its \
eight civilisations from it; the twelve new civilisations were transcribed from the strings and \
rules.json.\
"""

