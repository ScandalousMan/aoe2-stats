# The seventh knowledge snapshot for game build 185872 (T772, 2026-10-31): it closes the owner's
# readings (T771) on the sixth, `aoe2techtree-185872-civilisations-56`, and models the same
# fifty-six civilisations. A promoted snapshot is never edited (FR-025), so this one names the
# digest it supersedes: resolution by build now answers this snapshot, and the first six stay
# installed, promoted and loadable by their full identity so that the analyses published under
# them still reproduce their own bytes (SC-005). An analysis of a build 185872 recording published
# under any of them names a digest that is no longer the current one, so it is recomputed under
# this snapshot on the analyzer's next pass, as the contract's staleness rule says.
#
# Same source, same pack revision (`packages/knowledge/packs/aoe2techtree-3bb43b1/`), same
# normaliser version (2): `rules.json` and `aliases.toml` are the sixth's, byte for byte. What is
# new is `effects.toml` (seventeen refusals answered: thirty rows replace sixteen refusals, the
# seventeenth, answered "no", is gone, and four rows gain a sentence in `validated_by`) and
# `disagreements.toml` (Liquipedia's Forced Levy total, FR-028). No refusal is left on a field this
# knowledge base carries, so the build keeps no FR-022b entry. A reading that arrives after this
# promotion waits for the next snapshot.
[snapshot]
source = "aoe2techtree"
source_version = "3bb43b1439eef88dfe7fe892d7f7dc41ac9dd76f"
describes_build = 185872
digest = "sha256:45417481c2e078e22805d4d7c2365818dea34225634ecd22e52e8b48958d328c"
promoted = true
supersedes = "sha256:b247190134e69b46e5111487db0ff98514df9ceb41bcd4f926a7278fbedd952f"
normaliser_version = 2
civilisations_modelled = ["Franks", "Teutons", "Persians", "Saracens", "Malians", "Tatars", "Slavs", "Sicilians", "Britons", "Goths", "Japanese", "Chinese", "Byzantines", "Turks", "Vikings", "Mongols", "Celts", "Spanish", "Aztecs", "Mayans", "Huns", "Koreans", "Italians", "Hindustanis", "Incas", "Magyars", "Portuguese", "Ethiopians", "Berbers", "Khmer", "Malay", "Burmese", "Vietnamese", "Bulgarians", "Cumans", "Lithuanians", "Burgundians", "Poles", "Bohemians", "Dravidians", "Bengalis", "Gurjaras", "Romans", "Armenians", "Georgians", "Shu", "Wu", "Wei", "Jurchens", "Khitans", "Muisca", "Mapuche", "Tupi", "Saxons", "Varangians", "Danes"]

# FR-030's validation record, in the two forms the spec's amendment of 2026-10-31 admits.
[validation]
method = "independent-source-for-two-rows-second-reading-for-the-rest"
checked_against = """\
Two forms, row by row of the validation sample in \
specs/006-replay-analysis-foundations/owner-readings.md (FR-030, amended 2026-10-31). The strong \
form, validation against an independent second source, for the two rows an independent source \
confirmed: Teutons, Murder Holes (technology 322), free (0 food, 0 stone), and Vietnamese, Crop \
Rotation (technology 12), 250 food and no wood. Each was read on Liquipedia (Murder Holes; Crop \
Rotation, update 35584) by ChatGPT for the owner and accepted by the owner unchecked on \
2026-10-31; Liquipedia is a community wiki, not the pack's generation pipeline, so it is \
independent of the pack, and the snapshot answers what it read. Every other row of the sample, \
fifty-four, is the weaker form, a second reading of the pack through a different field (FR-030): \
the owner declined to read the running game (spec Clarifications, Session 2026-10-31) and no \
independent source was found to state those values. The two fields read are the civilisation's \
bonus sentence, packages/knowledge/packs/aoe2techtree-3bb43b1/strings.en.json (the \
help_string_id text), and the entity's own baseline for the sampled field, \
packages/knowledge/snapshots/aoe2techtree-185872-owner-readings/rules.json; the sampled value is \
recomputed from the one through the other by the tests, which is a second reading of one source \
and not independent validation. The rows this snapshot adds to the sixth's (the thirty rows that \
close the owner's readings) rest on the answers T771 recorded, each channel named in the row's \
validated_by; the rest of the snapshot is the sixth's and is validated there. The sixth's \
validation record: second-reading-checked-against-release-notes, performed 2026-10-26 by the \
T770 implementer, against the publisher's release notes for build 185872 \
(https://www.ageofempires.com/news/age-of-empires-ii-definitive-edition-update-185872/).\
"""
performed_by = "the T772 implementer (an AI agent working for the repository owner), by direct reading; no person has reviewed it yet"
performed_at = "2026-10-31"
not_checked = """\
T772 (2026-10-31): no value of the readings that closed seventeen refusals was compared with the \
game. Each came from the owner's own answer in chat (source not stated), from the Fandom wiki or \
Liquipedia read by ChatGPT for the owner and accepted by the owner without checking the page, or \
from a Fandom page the owner copied; the sheet names the channel of every row. The two \
independent confirmations of the validation sample (Teutons' Murder Holes, Vietnamese Crop \
Rotation) were accepted unchecked in the same way. Of the sample's other fifty-four rows, none \
was read at all: each is the weaker form, a second reading of the pack. The Persians' Kamandaran \
total (50 wood and no gold) is agreed by ChatGPT's reading of the Fandom Kamandaran page, which \
the owner accepted unchecked; no person has compared it with the game. Forced Levy's 70 food is \
the value consistent with the pack, over Liquipedia's 80 (FR-028, disagreements.toml). The \
Bohemians' totals are derived from the rule read (the gold replaced by an equal amount of food) \
applied to the pack's costs, as the sheet says, and only the Monk's and Illumination's were \
stated as totals. What the sixth snapshot recorded as not checked still holds, and follows. No \
value was compared with the game or with any second source that is independent of the pack: the \
bonuses, the baseline costs, times and ages in rules.json and the strings they are read from all \
come from the one vendored pack (research.md D3: no second source is lawful to vendor), so this \
is a second reading of one source and not independent validation. The release notes can only \
show a change the publisher chose to write down; a bonus change they omit cannot be detected \
from them. Read in full: the Balance Changes section. The rest of the page was searched for the \
civilisations' names and for cost, time, bonus and discount wording, not read line by line. The \
notes name the Shu (War Chariot cost and time, Treadmill Crane), Wei (Xianbei Raider cost), \
Jurchens (Grenadier cost), Mapuche ((Elite) Bolas Rider cost), Muisca (Temple Guard attack), \
Tupi ((Elite) Blackwood Archer cost) and, for the technology tree display, the Khitans; the \
Georgians and the Wu are not named anywhere on the page, and the Saxons, Varangians and Danes \
are added by it. Classes were resolved from the pack's help strings or production sites, not \
from a definition. Six readings are inferences no source states, flagged in their rows: Shu's \
'Archery Unit technologies at the Blacksmith' are the six archer technologies; Tupi's 'upgrades' \
and the Danes' 'upgrades' are each every technology the pack places at the named buildings; the \
Saxons' Foot Soldiers include every Infantry unit, and the Petard (440), which the pack calls a \
Demolition Siege Weapon, is outside the class and is not refused; the Khitans' bonus reaches the \
Imperial Skirmisher, which the Khitans' tree does not offer, so no game reading can reach it; \
and the Heavy Cavalry Archer's age is set with its upgrade's. Two more readings are unvalidated, \
flagged in their rows: the Persians' Kamandaran, read as a cost of 50 wood and no gold in total, \
and the Cumans' count table for the additional Town Center (two or more Town Centers controlled \
put the next one in the Castle Age). No source states either, and no game reading checks them. \
The Mapuche Settlements' own training times (update 170934) are not carried, since \
production_time holds one time per unit. The Butalmapu row discounts every unit the pack \
produces at the Castle but the Trebuchet and the Petard; whether the game also discounts the \
Krepost's Konnik and the Donjon's Serjeant is not stated by any source and is not modelled. The \
Cumans' Town Center count covers the three identifiers rules.json names; the others that \
aoc-reference-data calls 'Town Center' (measured in docs/data-sources.md) are in no pack. \
Changes to which technologies and units a civilisation can reach are not bonuses and are not \
rows; the tree in rules.json (normaliser version 2) answers them. The transcription was not \
blind: the implementer had read the fifth snapshot's effects.toml to learn the file's shape and \
carried its forty-four civilisations from it; the twelve new civilisations were transcribed from \
the strings and rules.json.\
"""

