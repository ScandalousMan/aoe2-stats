# T644/T645/T652m: hand-transcribed civilisation effects (research.md D5, data-model.md §6
# "Civilisation effect"). Transcribed from the English strings vendored in this pack
# (packages/knowledge/packs/aoe2techtree/strings.en.json), which FR-031 permits with provenance
# recorded on each entry below (`validated_by`).
#
# **T652m, 2026-09-23: three of the six modelled civilisations were misidentified, and two of
# them were not in either committed recording at all.** T644/T645 modelled Byzantines, Koreans,
# Franks, Persians, Teutons and Gurjaras, on the strength of a `[[civilisation_id]]` table
# (`raw_id -> name`) that turned out to be wrong at four of its six rows. The user named recording
# 2's real match directly (Franks + Teutons versus Tatars + Persians); reading each participant's
# own **technology** nodes only (`rules.json`'s `id` field, never a unit id — see below for why)
# against the pack's per-civilisation tree files reproduces that exactly, and narrows recording 1
# to Saracens versus Malians. **Byzantines, Koreans and Gurjaras are in neither committed
# recording**; their `[[effect]]` entries below are dead and have been removed. Saracens, Malians
# and Tatars are transcribed below for the first time, from `strings.en.json`'s own English help
# text. Franks, Persians and Teutons are untouched — their raw ids were already right, and their
# effects do not depend on which raw id resolves to which name.
#
# **Why technology ids and never unit ids.** Recording 2's slot 2 is now known to be Persians, and
# trains unit id 1755 — which this pack's own `data.json` lists as "Camel Scout",
# `ResearchedCompleted` for Gurjaras alone and absent from the Persians tree entirely. A unit id
# that is exclusive to one civilisation in this pack is therefore not proof that the trainer *is*
# that civilisation: the pack's `node_id` space for units is not reliable in the way the same
# space is for technologies. Every technology-exclusivity argument below held on all five
# participants a unique technology pins (research.md's own record of this); no unit-exclusivity
# argument is used anywhere in this file any more.
#
# **Classification rule, applied to every civilisation this file models.** A bonus that
# unconditionally and civilisation-specifically adjusts cost, a production time, an age
# requirement, a prerequisite, where something is produced, or availability is `modelled = "yes"`
# below. A bonus that would touch one of those fields but is team-wide, age-gated in a way this
# static rule cannot place, or conditional on researched state is `modelled = "no"`, with its
# reason, and an explicit selector naming the real entity or entities it would have touched — never
# a fuzzy class name (data-model.md §6). A bonus that touches no field this knowledge base tracks
# *and* has no representable entity at all (no unit, building or technology record corresponds to
# it), or whose own selector could only ever be an unenumerable fuzzy class ("Units", "Military
# Units"), cannot be written as a `[[effect]]` table at all — `effects.py`'s `Effect` requires a
# non-empty, explicit selector on every record, modelled or not — and is instead recorded as out of
# scope in the header comment introducing the civilisation it belongs to, never silently dropped.
# Coverage grows by whole civilisation and, within a modelled civilisation, bonus by bonus, and the
# aggregate gap report is the backlog (research.md D5).
#
# **Selector resolution — an explicit identifier list, never a fuzzy class name.** Every selector
# below was resolved by reading `rules.json`'s own structural fields (`prerequisites`,
# `produced_at`, `name`), not by hand-guessing which ids belong to a named class. Each
# civilisation's own header comment below records exactly how its own selectors were resolved.
#
# **Rounding.** Where an operand does not land on an integer resource amount, this package's stated
# convention (packages/knowledge/tests/test_query.py's module docstring) is round half up, applied
# by `effects.py`'s `_round_half_up` — never Python's own banker's rounding.

# T645: Franks, Persians and Teutons — the three of the second committed recording's four
# civilisations whose raw ids were already right (T652m only corrected the fourth, raw id 33,
# from Persians to Tatars — see the `[[civilisation_id]]` section at the foot of this file). Their
# own effects below are unchanged by that correction: an effect names a civilisation by its pack
# name, never by a replay's raw integer, so nothing here depends on which raw id resolves to which
# name.
#
# Franks: "Foragers work +15% faster" (no entity — a gather-rate modifier, not tied to any
# `rules.json` record) and "Mounted Units +20% HP starting in Feudal Age" (untracked field,
# unit-class selector too broad to enumerate usefully) are out of scope.
# Persians: "Start with +50 wood and +50 food" (no entity), "Town Centers and Docks +100% HP
# and work faster in age" (untracked, compound, age-gated), and the unique tech "Citadels"
# (untracked: Castle attack/armour) are out of scope. "Can build Caravanserai in Imperial Age"
# is also left out: only Persians and Hindustanis carry building 1754 at all in `data.json`, but
# `rules.json`'s own flattened baseline (`_raw_value_for_field`'s `available_to` baseline is
# always `True` once an entity resolves at all) already cannot represent "most civilisations
# lack this building entirely" without an effect naming every civilisation that lacks it — a
# limitation of the flattened model, not of this transcription pass, and recorded here rather
# than modelled with a no-op effect that would assert nothing real.
# Teutons: "Town Centers +10 / Towers +5 garrison capacity" (untracked), "Monks +100% healing
# range" (untracked), and the Team Bonus "Units more resistant to conversion" (untracked, and
# "Units" is exactly the fuzzy, unenumerable class this pass refuses to invent a selector for)
# are out of scope.

[[effect]]
civilisation = "Franks"
source_key = "120151"
source_text = "Mill technologies free"
modelled = "yes"
field = "cost"
operation = "set"
operand = { food = 0, wood = 0 }
selector = [
  { kind = "technology", id = "12" },
  { kind = "technology", id = "13" },
  { kind = "technology", id = "14" },
]
validated_by = """\
Weak form (FR-030): civilisation bonus scope has no independent source to validate against \
instead (research.md D3: the two community datasets are one generation pipeline run twice, and \
the game's own data file is barred by the publisher's usage rules). Two fields of the same \
vendored source read instead of an independent one: strings.en.json's help_string_id text, and \
the pack's own FRANKS.json tree file's node_status field. \
Second reading: packages/knowledge/packs/aoe2techtree/strings.en.json, help_string_id 120151, \
re-read in full on 2026-09-20 by the T645 implementer, independently of the first transcription \
pass earlier the same session, confirming the sentence verbatim and the selector's resolution to \
every technology packages/knowledge/packs/aoe2techtree/trees/FRANKS.json's own Mill (building 68) \
