# T644: hand-transcribed civilisation effects (research.md D5, data-model.md §6 "Civilisation
# effect"). Transcribed from the English strings vendored in this pack
# (packages/knowledge/packs/aoe2techtree/strings.en.json), which FR-031 permits with provenance
# recorded on each entry below (`validated_by`).
#
# **Byzantines and Koreans only** — the two civilisations the committed reference recordings train
# discounted units of (research.md D5, D11): both players in the first fixture trained a Byzantine
# Pikeman and Korean archers/crossbowmen. Every OTHER bonus in both civilisations' full help
# strings was read in full and classified, not silently skipped:
#
#   - A bonus that touches a field this knowledge base tracks (cost, a production time, an age
#     requirement, a prerequisite, where something is produced, or availability) and is
#     unconditional and civilisation-specific (not team-wide, not gated on an age this static rule
#     cannot place, not conditional on match state) is `modelled = "yes"` below.
#   - A bonus that is team-wide, age-gated in a way this effect model cannot place (its value
#     depends on which age a building was constructed in, which this static knowledge base has no
#     way to know), or conditional on match state (whether a technology has been researched) is
#     `modelled = "no"` below, with its reason, and its field stays gapped — never half-applied
#     (research.md D5).
#   - A bonus touching neither a tracked field nor the two entities these recordings need (e.g.
#     Byzantines' Fire Ship/Dromon attack-speed bonus, their Imperial Age cost discount, their free
#     Town Watch/Town Patrol; Koreans' faster stone mining, their Warship wood discount) is out of
#     scope for this pass — not fabricated, not silently modelled as absent either. Coverage grows
#     by whole civilisations and the aggregate gap report is the backlog (research.md D5), and
#     within a modelled civilisation it grows bonus by bonus the same way.
#
# **Selector resolution — an explicit identifier list, never a fuzzy class name.** Every selector
# below was resolved by reading `rules.json`'s own structural fields, not by hand-guessing which
# ids belong to a named class:
#
#   - Byzantines' "Spearman-line": the upgrade chain `rules.json` itself encodes in
#     `prerequisites` — Spearman (93) has no prerequisite, Pikeman (358) prerequires 93, Halberdier
#     (359) prerequires 358. All three are trained at the Barracks (building 12).
#   - Byzantines' "Camel Riders" and "Skirmishers": the same prerequisite-chain method, at the
#     Stable (101) and Archery Range (87) respectively — Camel Rider (329), Heavy Camel Rider
#     (330, prerequires 329) and Imperial Camel Rider (207, prerequires 330); Skirmisher (7), Elite
#     Skirmisher (6, prerequires 7) and Imperial Skirmisher (1155, prerequires 6). A fourth id,
#     "Camel Scout" (1755), shares Camel Rider's exact cost and is also produced at the Stable, but
#     its prerequisite/tree linkage does not agree with the rest of the chain (it is not named as a
#     prerequisite by 329, unlike every other link in these three chains) — recorded here as a
#     known data-quality question in the vendored pack's per-civilisation tree merge
#     (`normalise.py`'s majority-vote reduction), not resolved by guessing, and left out of this
#     selector.
#   - Koreans' "Ranged Soldiers and Infantry": every unit `rules.json` itself records as produced
#     at the Archery Range (87) or the Barracks (12) — `produced_at.id`, a real structural field,
#     not a class label this pack carries anywhere. 18 Archery Range units and 27 Barracks units,
#     45 in total, including both units the committed recordings need (Crossbowman, 24; Pikeman,
#     358, already covered by the Byzantine effect above).
#
# **Rounding.** Where an operand does not land on an integer resource amount, this package's stated
# convention (packages/knowledge/tests/test_query.py's module docstring) is round half up, applied
# by `effects.py`'s `_round_half_up` — never Python's own banker's rounding.

[[effect]]
civilisation = "Byzantines"
source_key = "120156"
source_text = "Camel Riders, Skirmishers and Spearman-line cost -25%"
modelled = "yes"
field = "cost"
operation = "multiply"
operand = { food = 0.75, wood = 0.75, gold = 0.75, stone = 0.75 }
selector = [
  { kind = "unit", id = "93" },
  { kind = "unit", id = "358" },
  { kind = "unit", id = "359" },
  { kind = "unit", id = "329" },
  { kind = "unit", id = "330" },
  { kind = "unit", id = "207" },
  { kind = "unit", id = "7" },
  { kind = "unit", id = "6" },
  { kind = "unit", id = "1155" },
]
validated_by = """\
Second reading: packages/knowledge/packs/aoe2techtree/strings.en.json, help_string_id 120156, \
re-read in full on 2026-09-20 by the T644 implementer, independently of the first transcription \
pass earlier the same session, confirming the sentence verbatim and the selector's resolution \
against rules.json's own prerequisites/produced_at fields for units 93/358/359 (Barracks, \
building 12), 329/330/207 (Stable, building 101) and 7/6/1155 (Archery Range, building 87).\
"""

