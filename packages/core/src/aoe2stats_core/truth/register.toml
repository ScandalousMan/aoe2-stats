# The determinability register — the only place a classification is written.
# Schema and loader guarantees: specs/006-replay-analysis-foundations/contracts/register.md
# `evidence` is always a reference into docs/data-sources.md or a research record, never a restated
# measurement (SC-013). `path` is the entry's position in the published document, which is what lets
# the publication gate resolve a leaf to exactly one datum.

[datum."document.schema_version"]
classification = "observed"
status = "published"
path = "schema_version"
source = "the analyzer's own document constant, not a field of the recording"
method = "written verbatim by the analyzer when it serialises the document; names the document's shape"
requires_knowledge = []
depends_on = []
validation = "packages/replay-engine/tests/test_extract.py — golden timeline"
evidence = "specs/006-replay-analysis-foundations/research.md D8"

