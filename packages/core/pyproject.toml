[project]
name = "aoe2stats-core"
version = "0.1.0"
description = "Entities, value objects and use cases with no I/O — the replay-engine Protocol and alerting."
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2stats_core"]

# Rebuild this package's cached wheel whenever a file it ships changes, not only when this file
# does — the reason is in `packages/knowledge/pyproject.toml`'s `[tool.uv]` comment.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]
