[project]
name = "aoe2stats-storage"
version = "0.1.0"
description = "SQLAlchemy models and repositories, plus the S3 object store client and key scheme."
requires-python = ">=3.13,<3.14"
dependencies = ["sqlalchemy>=2.0.36", "psycopg[binary]>=3.2", "boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2stats_storage"]
