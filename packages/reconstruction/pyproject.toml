[project]
name = "aoe2stats-reconstruction"
version = "0.1.0"
description = "Pure match reconstruction: a canonical stream and a knowledge snapshot in, a reconstruction out."
requires-python = ">=3.13,<3.14"
dependencies = [
  "aoe2stats-core",
  "aoe2stats-knowledge",
]

[tool.uv.sources]
aoe2stats-core = { workspace = true }
aoe2stats-knowledge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2stats_reconstruction"]

# Rebuild this package's cached wheel whenever a file it ships changes, not only when this file
# does — the reason is in `packages/knowledge/pyproject.toml`'s `[tool.uv]` comment.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]
