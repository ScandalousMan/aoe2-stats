[project]
name = "aoe2stats-api"
version = "0.1.0"
description = "The FastAPI application — the ASGI entrypoint re-exported by api/index.py on Vercel."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "httpx>=0.27",
  "aoe2stats-storage",
]

[tool.uv.sources]
aoe2stats-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2stats_api"]
