[project]
name = "aoe2stats-api"
version = "0.1.0"
description = "The FastAPI application — the ASGI entrypoint re-exported by api/index.py on Vercel."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "aoe2stats-storage",
  # `routers/auth.py` (T029) builds the one `httpx.Client`/`httpx.AsyncClient` pair every
  # per-request `SteamAuthProvider`/`RelicProfileProvider` instance shares, and hands them to
  # `aoe2stats-providers` rather than issuing any request itself — constitution III's "apps/*
  # ... never open an outbound connection" is about where a *request* is issued (inside
  # `SyncBaseProvider._request`/`AsyncBaseProvider._request`, in `packages/providers`), not about
  # which package is allowed to construct the client object a provider is built from — the same
  # split `deps.py` already draws for `ObjectStore` and the database engine. `httpx` was
  # previously dev-only, imported only by `TestClient` under `tests/`; T029 is what makes it a
  # real runtime dependency of this package for the first time.
  "httpx>=0.27",
  "aoe2stats-providers",
  # `routers/cron.py`'s local-trigger route needs this to call `run_once()` (T018). From T055
  # onward, `aoe2stats-ingester` itself depends on `aoe2stats-replay-engine` for its capture
  # stage — so keep this import lazy, inside that one handler, forever: a module-scope import
  # anywhere on this path would drag the engine into every cold start of the API function, not
  # only the request that actually triggers a cycle (T018c, constitution V).
  "aoe2stats-ingester",
]

[tool.uv.sources]
aoe2stats-storage = { workspace = true }
aoe2stats-providers = { workspace = true }
aoe2stats-ingester = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2stats_api"]
