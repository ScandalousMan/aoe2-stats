[project]
name = "aoe2stats-api"
version = "0.1.0"
description = "The FastAPI application — the ASGI entrypoint re-exported by api/index.py on Vercel."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  # `routers/replays.py`'s `POST /api/replays/{game_id}/upload` (T080) is this package's one
  # multipart route — FastAPI's own `UploadFile`/`File(...)` machinery raises at route-registration
  # time without this, Starlette's own multipart parser dependency, never bundled with FastAPI
  # itself.
  "python-multipart>=0.0.9",
  "aoe2stats-storage",
  # `routers/auth.py` (T029) builds the one `httpx.Client`/`httpx.AsyncClient` pair every
  # per-request `SteamAuthProvider`/`RelicProfileProvider` instance shares by calling
  # `aoe2stats_providers.wiring.build_sync_client_resources`/`build_async_client_resources`
  # rather than constructing an `httpx.Client` itself (T014f) — so this package needs no direct
  # `httpx` dependency of its own: `aoe2stats-providers` already declares it as a runtime
  # dependency, and `apps/api/tests/` gets it transitively through that, the same way it gets
  # every other transitive requirement no package here restates. Declaring it again here would
  # re-open the network boundary `tests/architecture/test_import_graph.py` (constitution III)
  # checks by import graph, not by dependency list — this package must have no *reason* to write
  # `import httpx` itself, and a declared dependency is exactly that reason.
  "aoe2stats-providers",
  # `routers/cron.py`'s local-trigger route needs this to call `run_once()` (T018) — always
  # imported lazily, inside that one handler, so a module-scope import never drags the engine
  # into every cold start of the API function (T018c, constitution V).
  "aoe2stats-ingester",
  # `ingest_stages.py` (T060) is the one place this package constructs a real `ReplayValidator`
  # (`Aoe2RecValidator`) to hand to `CaptureDrain` — imported lazily, inside
  # `build_ingest_stages`, for the identical reason `aoe2stats-ingester`'s own `run_once` is:
  # a module-scope import anywhere reachable from `aoe2stats_api.app` would drag `aoe2rec_py`
  # into every cold start (T018c, constitution V; `apps/api/tests/test_engine_isolation.py`).
  "aoe2stats-replay-engine",
]

[tool.uv.sources]
aoe2stats-storage = { workspace = true }
aoe2stats-providers = { workspace = true }
aoe2stats-ingester = { workspace = true }
aoe2stats-replay-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2stats_api"]
