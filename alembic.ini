# Alembic configuration for the schema in `packages/storage/src/aoe2stats_storage/models.py`.
#
# Lives at the repository root, not inside `infra/migrations/`, because `uv run alembic ...` is
# always invoked from the root — CI's `migrations` job in `.github/workflows/pr.yml` does exactly
# that — and Alembic looks for `alembic.ini` in the current working directory by default.
# `sqlalchemy.url` is intentionally absent below: `infra/migrations/env.py` reads `DATABASE_URL`
# from the environment instead, so no connection string (and no secret) is ever written here.

[alembic]
script_location = infra/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
